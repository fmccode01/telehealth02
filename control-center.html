  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
}
.exp-preview-toc-item.extra .exp-preview-toc-num { background: var(--ink-mid); }
.exp-preview-toc-name { font-size: 12px; font-weight: 700; color: var(--ink-deep); }
.exp-preview-toc-sub { font-size: 10px; color: var(--ink-mid); font-style: italic; margin-top: 1px; }
.exp-preview-toc-pgs { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-light); }

.exp-preview-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.exp-summary-card {
  background: white;
  border-radius: 9px;
  padding: 13px 15px;
  border: 1px solid var(--line-faint);
  text-align: center;
}
.exp-summary-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 30px;
  color: var(--moss);
  line-height: 1;
}
.exp-summary-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 6px;
}

.exp-preview-formats {
  background: white;
  border: 1px solid var(--line-faint);
  border-radius: 9px;
  padding: 14px 17px;
}
.exp-preview-formats-eye {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 10px;
}
.exp-preview-format-list { display: flex; gap: 10px; flex-wrap: wrap; }
.exp-preview-format {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--bone);
  border-radius: 7px;
  padding: 8px 12px;
}
.exp-preview-format-icon { font-size: 18px; }
.exp-preview-format-name { font-size: 12px; font-weight: 700; color: var(--ink-deep); }
.exp-preview-format-detail { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-light); margin-top: 1px; }

.exp-compliance {
  display: flex;
  gap: 13px;
  border-radius: 9px;
  padding: 13px 16px;
  border-left: 4px solid;
}
.exp-compliance.urgent { background: var(--rust-bg); border-color: var(--rust); }
.exp-compliance.warn { background: var(--amber-bg); border-color: var(--amber); }
.exp-compliance.good { background: var(--moss-bg); border-color: var(--moss); }
.exp-compliance-icon { font-size: 24px; flex-shrink: 0; }
.exp-compliance-title { font-size: 13px; font-weight: 700; color: var(--ink-deep); margin-bottom: 4px; }
.exp-compliance-body { font-size: 11.5px; color: var(--ink-mid); line-height: 1.5; }
.exp-compliance-body strong { color: var(--ink-deep); font-weight: 700; }

.exp-final-confirm {
  background: var(--bone);
  border: 1.5px dashed var(--ink-mid);
  border-radius: 9px;
  padding: 14px 16px;
}
.exp-final-check {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  cursor: pointer;
}
.exp-final-check input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--moss);
  margin-top: 2px;
  flex-shrink: 0;
}
.exp-final-check-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-deep);
}
.exp-final-check-sub {
  font-size: 11px;
  color: var(--ink-mid);
  font-style: italic;
  margin-top: 3px;
  line-height: 1.5;
}

/* FOOTER */
.exp-footer {
  padding: 14px 28px;
  background: white;
  border-top: 1px solid var(--line-faint);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.exp-footer-info {
  font-size: 11.5px;
  color: var(--ink-mid);
  font-style: italic;
}
.exp-footer-btns { display: flex; gap: 9px; }
.exp-btn-back {
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 8px;
  padding: 9px 16px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mid);
  cursor: pointer;
  transition: all 0.12s;
}
.exp-btn-back:hover { background: var(--bone); border-color: var(--ink-deep); color: var(--ink-deep); }
.exp-btn-next, .exp-btn-confirm {
  background: var(--ink-deep);
  color: var(--parchment);
  border: 1px solid var(--ink-deep);
  border-radius: 8px;
  padding: 9px 18px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
}
.exp-btn-next:hover:not(:disabled) { background: var(--moss); border-color: var(--moss); transform: translateY(-1px); }
.exp-btn-confirm { background: var(--moss); border-color: var(--moss); }
.exp-btn-confirm:hover:not(:disabled) { background: #4A6336; border-color: #4A6336; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(92,117,68,0.3); }
.exp-btn-next:disabled, .exp-btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

@media (max-width: 900px) {
  .exp-presets { grid-template-columns: repeat(2, 1fr); }
  .exp-grid-sections { grid-template-columns: 1fr; }
  .exp-grid-formats { grid-template-columns: repeat(2, 1fr); }
  .exp-extras { grid-template-columns: 1fr; }
  .exp-preview-grid { grid-template-columns: 1fr; }
  .exp-preview-summary { grid-template-columns: repeat(2, 1fr); }
  .exp-grid-filters { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .exp-presets { grid-template-columns: 1fr; }
  .exp-dialog { max-height: 100vh; border-radius: 0; }
  .exp-backdrop { padding: 0; }
}

/* Floating chart tooltip */
.chart-tip {
  position: fixed;
  z-index: 3000;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 10px;
  padding: 13px 15px;
  box-shadow: 0 12px 36px rgba(31,27,22,0.22);
  width: 300px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-deep);
  pointer-events: none;
  animation: tip-in 0.12s ease-out;
}
@keyframes tip-in {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}
.chart-tip-eye {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 4px;
}
.chart-tip-title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 17px;
  font-weight: 500;
  color: var(--ink-deep);
  line-height: 1.2;
  margin-bottom: 7px;
}
.chart-tip-body {
  font-size: 11.5px;
  color: var(--ink-mid);
  margin-bottom: 9px;
  line-height: 1.45;
}
.chart-tip-stats {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 9px;
  padding: 9px 0;
  border-top: 1px dashed var(--line-faint);
  border-bottom: 1px dashed var(--line-faint);
  margin-bottom: 9px;
}
.chart-tip-stat {
  display: contents;
}
.chart-tip-stat-label {
  font-size: 10.5px;
  color: var(--ink-light);
  font-weight: 500;
}
.chart-tip-stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  text-align: right;
  color: var(--ink-deep);
}
.chart-tip-stat-val.good { color: var(--moss); }
.chart-tip-stat-val.warn { color: #8B6817; }
.chart-tip-stat-val.bad { color: var(--rust); }
.chart-tip-note {
  background: var(--bone);
  border-left: 2px solid var(--moss);
  border-radius: 4px;
  padding: 7px 9px;
  font-size: 11px;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.45;
}
.chart-tip-note strong { color: var(--ink-deep); font-style: normal; font-weight: 700; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  background: var(--ink-deep);
  color: var(--parchment);
  padding: 12px 16px;
  border-radius: 9px;
  display: flex; align-items: center; gap: 11px;
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(31,27,22,0.25);
  animation: toast-in 0.25s ease-out;
  max-width: 360px;
}
@keyframes toast-in {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.toast-success { background: linear-gradient(135deg, #4A6336, var(--moss)); }
.toast-info { background: linear-gradient(135deg, #3B6A60, var(--teal)); }
.toast-warn { background: linear-gradient(135deg, #A88439, var(--amber)); }
.toast-error { background: linear-gradient(135deg, #8B3F28, var(--rust)); }
.toast-icon {
  font-size: 16px;
  width: 22px; height: 22px;
  background: rgba(255,255,255,0.18);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.toast-msg { flex: 1; line-height: 1.4; }
.toast-close {
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  flex-shrink: 0;
  line-height: 1;
}
.toast-close:hover { color: white; }

/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31,27,22,0.45);
  z-index: 1500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  animation: backdrop-in 0.18s ease-out;
  backdrop-filter: blur(2px);
}
@keyframes backdrop-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal {
  background: white;
  border-radius: 13px;
  width: 100%;
  max-width: 540px;
  max-height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(31,27,22,0.3);
  animation: modal-in 0.22s ease-out;
}
.modal.urgent {
  border-top: 4px solid var(--rust);
}
@keyframes modal-in {
  from { transform: translateY(-15px) scale(0.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.modal-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line-faint);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.modal-eyebrow {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 4px;
}
.modal.urgent .modal-eyebrow { color: var(--rust); }
.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--ink-deep);
  line-height: 1.2;
}
.modal-close {
  width: 28px; height: 28px;
  background: var(--bone);
  border: 1px solid var(--line-mid);
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.modal-close:hover { background: white; border-color: var(--ink-deep); }
.modal-body {
  padding: 18px 22px;
  overflow-y: auto;
  flex: 1;
  font-size: 13px;
  line-height: 1.5;
}
.modal-body p { margin: 0 0 6px; color: var(--ink-deep); }
.modal-body p strong { color: var(--ink-deep); font-weight: 700; }
.modal-footer {
  padding: 13px 22px;
  border-top: 1px solid var(--line-faint);
  background: var(--bone);
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  border-radius: 0 0 13px 13px;
}
.modal-btn-cancel {
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 7px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mid);
  transition: all 0.12s;
}
.modal-btn-cancel:hover { background: var(--bone); border-color: var(--ink-deep); color: var(--ink-deep); }
.modal-btn-confirm {
  background: var(--ink-deep);
  color: var(--parchment);
  border: 1px solid var(--ink-deep);
  border-radius: 7px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.12s;
}
.modal-btn-confirm:hover:not(:disabled) { background: var(--moss); border-color: var(--moss); transform: translateY(-1px); }
.modal-btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-btn-confirm.urgent { background: var(--rust); border-color: var(--rust); }
.modal-btn-confirm.urgent:hover:not(:disabled) { background: #8B3F28; border-color: #8B3F28; }

/* Modal form elements */
.modal-field { margin-bottom: 13px; }
.modal-field label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 5px;
}
.modal-input, .modal-textarea {
  width: 100%;
  border: 1px solid var(--line-mid);
  border-radius: 7px;
  padding: 8px 11px;
  font-family: inherit;
  font-size: 13px;
  background: white;
  color: var(--ink-deep);
}
.modal-input:focus, .modal-textarea:focus {
  outline: none;
  border-color: var(--ink-deep);
  box-shadow: 0 0 0 3px rgba(31,27,22,0.07);
}
.modal-textarea {
  resize: vertical;
  font-family: inherit;
  line-height: 1.5;
  min-height: 60px;
}
.modal-template {
  background: var(--bone);
  border: 1px solid var(--line-mid);
  border-radius: 99px;
  padding: 4px 11px;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink-mid);
  cursor: pointer;
  transition: all 0.12s;
}
.modal-template:hover { background: var(--ink-deep); color: var(--parchment); border-color: var(--ink-deep); }
.modal-checklist {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px 9px;
  margin-top: 4px;
}
.modal-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-deep);
  cursor: pointer;
  padding: 4px 0;
}
.modal-check input[type="checkbox"] {
  width: 14px; height: 14px;
  accent-color: var(--moss);
  cursor: pointer;
}

@media (max-width: 600px) {
  .modal-checklist { grid-template-columns: 1fr; }
  .toast { right: 12px; left: 12px; bottom: 12px; max-width: none; }
}

/* ═════════════ EXPORT CENTER · 4-step wizard ═════════════ */
.exp-modal {
  max-width: 900px !important;
  width: 95vw;
  max-height: 92vh;
}
.exp-body {
  padding: 0 !important;
  display: flex;
  flex-direction: column;
}

/* Stepper */
.exp-stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 14px 22px;
  background: var(--parchment-warm);
  border-bottom: 1px solid var(--line-faint);
}
.exp-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 14px;
  position: relative;
  flex: 1;
  justify-content: center;
}
.exp-step:not(:last-child)::after {
  content: '';
  position: absolute;
  right: -10px;
  width: 30px;
  height: 1px;
  background: var(--line-mid);
  top: 50%;
}
.exp-step-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: white;
  border: 2px solid var(--line-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-mid);
  flex-shrink: 0;
}
.exp-step.active .exp-step-num {
  background: var(--ink-deep);
  border-color: var(--ink-deep);
  color: var(--parchment);
}
.exp-step.done .exp-step-num {
  background: var(--moss);
  border-color: var(--moss);
  color: white;
}
.exp-step-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-light);
  letter-spacing: 0.05em;
}
.exp-step.active .exp-step-label { color: var(--ink-deep); }

/* Body padding */
.exp-body {
  padding: 22px 26px 18px !important;
  overflow-y: auto;
  flex: 1;
}

/* Section titles */
.exp-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--ink-deep);
  margin-bottom: 13px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--line-faint);
}
.exp-section-title span:first-child { font-style: italic; }
.exp-counter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-style: normal !important;
  font-weight: 600;
  color: var(--ink-light);
  letter-spacing: 0.02em;
}

/* Presets */
.exp-presets { margin-bottom: 14px; }
.exp-presets-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 8px;
}
.exp-presets-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.exp-preset {
  background: white;
  border: 1.5px solid var(--line-mid);
  border-radius: 9px;
  padding: 10px 12px;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: inherit;
  transition: all 0.12s;
}
.exp-preset:hover {
  border-color: var(--moss);
  background: var(--moss-bg);
  transform: translateY(-1px);
}
.exp-preset-icon { font-size: 18px; flex-shrink: 0; }
.exp-preset-name {
  flex: 1;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-deep);
  line-height: 1.3;
}
.exp-preset-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--ink-light);
  font-weight: 600;
}

/* Divider */
.exp-divider {
  height: 1px;
  background: var(--line-faint);
  margin: 16px 0;
}

/* Categories */
.exp-categories {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.exp-cat {
  background: var(--bone);
  border-radius: 9px;
  padding: 12px 14px;
}
.exp-cat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line-faint);
}
.exp-cat-check {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.exp-cat-check input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: var(--moss);
  cursor: pointer;
}
.exp-cat-icon { font-size: 16px; }
.exp-cat-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-deep);
}
.exp-cat-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--moss);
  font-weight: 700;
}

.exp-items {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
}
.exp-item {
  display: grid;
  grid-template-columns: 22px 1fr 34px;
  gap: 10px;
  align-items: center;
  padding: 7px 10px;

  border-radius: 6px;

}
.exp-item:hover {
  border-color: var(--line-mid);
  background: var(--parchment-warm);
}
.exp-item.on {
  background: var(--moss-bg);
  border-color: var(--moss);
}
.exp-item input[type="checkbox"] {
  width: 14px; height: 14px;
  accent-color: var(--moss);
  cursor: pointer;
}
.exp-item-body { min-width: 0; }
.exp-item-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-deep);
  line-height: 1.3;
}
.exp-item-desc {
  font-size: 10px;
  color: var(--ink-mid);
  font-style: italic;
  margin-top: 1px;
}
.exp-item-size {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--ink-light);
  background: var(--bone);
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 700;
  text-align: center;
}

/* Scenario grid */
.exp-scenario-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.exp-scenario {}
.exp-scenario-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 5px;
}
.exp-input {
  width: 100%;
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: inherit;
  font-size: 12px;
  background: white;
  color: var(--ink-deep);
}
.exp-input:focus { outline: none; border-color: var(--ink-deep); box-shadow: 0 0 0 3px rgba(31,27,22,0.07); }
.exp-date-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.exp-date-row .exp-input { flex: 1; }
.exp-date-row span { font-size: 10px; color: var(--ink-light); font-weight: 600; }

/* Toggles + checks list */
.exp-toggles {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.exp-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-deep);
  cursor: pointer;
}
.exp-toggle input { accent-color: var(--moss); width: 14px; height: 14px; }

.exp-checks {

  flex-direction: column;
  gap: 5px;

}
.exp-check {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 10px;
  align-items: center;
  padding: 8px 11px;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.1s;
}
.exp-check.on {
  background: var(--moss-bg);
  border-color: var(--moss);
}
.exp-check input { accent-color: var(--moss); width: 14px; height: 14px; cursor: pointer; }
.exp-check-label { font-size: 12px; font-weight: 600; color: var(--ink-deep); }
.exp-check-desc { font-size: 10.5px; color: var(--ink-mid); font-style: italic; margin-top: 1px; }

/* Radio grid for frequency */
.exp-radio-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 6px;
}
.exp-radio {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: white;
  border: 1.5px solid var(--line-mid);
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-deep);
  transition: all 0.1s;
}
.exp-radio.on {
  background: var(--moss-bg);
  border-color: var(--moss);
}
.exp-radio input { accent-color: var(--moss); }
.exp-radio-icon { font-size: 16px; }

/* Fields */
.exp-field { margin-bottom: 13px; }
.exp-field label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 5px;

// ═══════════════════════════════════════════════════════════
// SPARKLINE COMPONENT
// ═══════════════════════════════════════════════════════════
function Sparkline({ data, color = 'var(--ink-deep)' }) {
  if (!data || data.length < 2) return null;
  const W = 100, H = 22;
  const max = Math.max(...data), min = Math.min(...data);
  const range = (max - min) || 1;
  const step = W / (data.length - 1);
  const y = v => 2 + ((max - v) / range) * (H - 4);
  const path = data.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return (
    <svg className="prow-sparkline" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <path d={path} stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" />
      <circle cx={(data.length - 1) * step} cy={y(data[data.length - 1])} r="2" fill={color} />
    </svg>
  );
}

// Detailed weight chart with axes, area, and animation
function WeightChart({ data, lane }) {
  if (!data || data.length < 2) return null;
  const W = 420, H = 140;
  const padL = 32, padR = 8, padT = 12, padB = 24;
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = (max - min) || 1;
  const yScale = v => padT + ((max - v) / range) * (H - padT - padB);
  const xScale = i => padL + (i / (data.length - 1)) * (W - padL - padR);
  const color = lane === 'critico' ? 'var(--rust)' : lane === 'atencao' ? 'var(--amber)' : lane === 'fluxo' ? 'var(--moss)' : 'var(--slate)';
  const fillColor = lane === 'critico' ? 'rgba(160,72,48,0.12)' : lane === 'atencao' ? 'rgba(200,156,70,0.12)' : lane === 'fluxo' ? 'rgba(92,117,68,0.12)' : 'rgba(95,107,124,0.12)';

  const linePath = data.map((v, i) => `${i === 0 ? 'M' : 'L'}${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L${xScale(data.length-1)},${H-padB} L${xScale(0)},${H-padB} Z`;

  // Grid lines: 4 horizontal
  const gridY = [0, 0.33, 0.66, 1].map(p => padT + p * (H - padT - padB));
  const gridVals = [max, max - range*0.33, max - range*0.66, min].map(v => v.toFixed(1));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {/* Grid */}
      {gridY.map((y, i) => (
        <g key={i}>
          <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--line-faint)" strokeWidth="0.5" strokeDasharray="2,3" />
          <text x={padL-5} y={y+3} fontSize="8" fill="var(--ink-light)" textAnchor="end" fontFamily="JetBrains Mono">{gridVals[i]}</text>
        </g>
      ))}
      {/* X axis week labels (every 2 weeks) */}
      {data.map((v, i) => i % Math.max(1, Math.floor(data.length / 6)) === 0 || i === data.length - 1 ? (
        <text key={i} x={xScale(i)} y={H-8} fontSize="8" fill="var(--ink-light)" textAnchor="middle" fontFamily="JetBrains Mono">s{i+1}</text>
      ) : null)}
      {/* Area */}
      <path d={areaPath} fill={fillColor} />
      {/* Line */}
      <path d={linePath} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      {/* Points */}
      {data.map((v, i) => (
        <circle key={i} cx={xScale(i)} cy={yScale(v)} r={i === data.length - 1 ? 4 : 2.5} fill={color} stroke="white" strokeWidth="1.5" />
      ))}
      {/* Last point label */}
      <text x={xScale(data.length-1)} y={yScale(data[data.length-1])-8} fontSize="10" fill={color} textAnchor="middle" fontWeight="700" fontFamily="JetBrains Mono">{data[data.length-1]}</text>
    </svg>
  );
}

// PACIENTES VIEW

// ═══════════════════════════════════════════════════════════
// AÇÃO VIEW · focused on patients needing action
// ═══════════════════════════════════════════════════════════
function AcaoView({ patients, addressedIds, onToggleAddressed, onSelect, onAction }) {
  const acaoPatients = patients.filter(p => p.lane === 'critico' || p.lane === 'atencao');
  const sortByName = (a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' });
  const pending = acaoPatients.filter(p => !addressedIds.has(p.id));
  const addressed = acaoPatients.filter(p => addressedIds.has(p.id));
  const critico = pending.filter(p => p.lane === 'critico').sort(sortByName);
  const atencao = pending.filter(p => p.lane === 'atencao').sort(sortByName);

  return (
    <>
      <div className="main-head">
        <div className="main-eyebrow">🎯 Ação · pacientes que precisam intervenção agora</div>
        <h1 className="main-title">
          {pending.length} <em>{pending.length === 1 ? 'pendente' : 'pendentes'}</em>
          {addressed.length > 0 && <span style={{color:'var(--moss)',fontStyle:'normal',fontSize:18,marginLeft:14,fontWeight:600}}>· ✓ {addressed.length} endereçado{addressed.length === 1 ? '' : 's'} hoje</span>}
        </h1>
        <div className="main-sub">Clique no <strong>+</strong> de cada linha para expandir o briefing · use o <strong style={{color:'var(--moss)'}}>✓ Endereçar</strong> para marcar como resolvido</div>
      </div>

      {critico.length > 0 && (
        <div className="lane">
          <div className="lane-head">
            <span className="lane-icon">🔴</span>
            <span className="lane-title">Crítico</span>
            <span className="lane-count">{critico.length} {critico.length === 1 ? 'paciente' : 'pacientes'}</span>
            <span className="lane-rule">ação em 2h · EA ≥6 · SM 2+ vermelhos · reganho >5%</span>
          </div>
          <div className="prow-list">
            {critico.map(p => <PatientRow key={p.id} patient={p} isAddressed={false} onToggleAddressed={() => onToggleAddressed(p.id)} onSelect={onSelect} onAction={onAction} />)}
          </div>
        </div>
      )}

      {atencao.length > 0 && (
        <div className="lane">
          <div className="lane-head">
            <span className="lane-icon">🟠</span>
            <span className="lane-title">Atenção</span>
            <span className="lane-count">{atencao.length} {atencao.length === 1 ? 'paciente' : 'pacientes'}</span>
            <span className="lane-rule">ação no dia · FNQ↑ · silêncio >10d · PHQ moderado</span>
          </div>
          <div className="prow-list">
            {atencao.map(p => <PatientRow key={p.id} patient={p} isAddressed={false} onToggleAddressed={() => onToggleAddressed(p.id)} onSelect={onSelect} onAction={onAction} />)}
          </div>
        </div>
      )}

      {addressed.length > 0 && (
        <div className="lane addressed-lane">
          <div className="lane-head">
            <span className="lane-icon">✓</span>
            <span className="lane-title" style={{color:'var(--moss)'}}>Endereçados <em style={{color:'var(--moss)'}}>hoje</em></span>
            <span className="lane-count" style={{color:'var(--moss)'}}>{addressed.length} {addressed.length === 1 ? 'concluído' : 'concluídos'}</span>
            <span className="lane-rule">ação registrada · sairá da fila no próximo refresh</span>
          </div>
          <div className="prow-list">
            {addressed.sort(sortByName).map(p => <PatientRow key={p.id} patient={p} isAddressed={true} onToggleAddressed={() => onToggleAddressed(p.id)} onSelect={onSelect} onAction={onAction} />)}
          </div>
        </div>
      )}

      {pending.length === 0 && addressed.length === 0 && (
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--ink-light)'}}>
          <div style={{fontSize:48,marginBottom:14}}>✓</div>
          <div style={{fontFamily:'Cormorant Garamond, serif',fontStyle:'italic',fontSize:24,color:'var(--moss)'}}>Nenhum paciente em ação</div>
          <div style={{fontSize:13,marginTop:6}}>Toda coorte em rotina ou fluxo · momento de revisar protocolos.</div>
        </div>
      )}

      {pending.length === 0 && addressed.length > 0 && (
        <div style={{textAlign:'center',padding:'40px 20px',color:'var(--moss)',background:'var(--moss-bg)',borderRadius:14,marginBottom:22}}>
          <div style={{fontSize:42,marginBottom:8}}>🎉</div>
          <div style={{fontFamily:'Cormorant Garamond, serif',fontStyle:'italic',fontSize:24,color:'var(--moss)'}}>Tudo endereçado!</div>
          <div style={{fontSize:13,marginTop:6,color:'var(--ink-mid)'}}>{addressed.length} {addressed.length === 1 ? 'paciente concluído' : 'pacientes concluídos'} · coorte sob controle</div>
        </div>
      )}
    </>
  );
}

function PacientesView({ patients, search, etiqueta, addressedIds, onToggleAddressed, onSelect, onAction }) {
  // Sort alphabetically by name (Portuguese locale, accent-aware)
  const sorted = [...patients].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

  return (

        <h1 className="main-title">
          {search ? <>Busca: <em>"{search}"</em> · {patients.length} {patients.length === 1 ? 'resultado' : 'resultados'}</> :
            <>{patients.length} <em>{patients.length === 1 ? 'paciente' : 'pacientes'}</em> · A → Z</>}

        <div className="main-sub">

      {patients.length === 0 && search && (
        <div style={{textAlign:'center',padding:'40px 20px',color:'var(--ink-light)'}}>

          <div style={{fontSize:12,marginTop:6}}>Tente outro nome ou limpe a busca.</div>
        </div>
      )}

      {sorted.length > 0 && (
        <div className="prow-list">

  );

// ═══════════════════════════════════════════════════════════
// PATIENT ROW
// ═══════════════════════════════════════════════════════════
function PatientRow({ patient: p, onSelect, isAddressed = false, onToggleAddressed, onAction, defaultExpanded = false }) {
  const [expanded, setExpanded] = useState(defaultExpanded);
  const fireAction = (e, action) => {
    e.stopPropagation();
    if (onAction) onAction(action, p);
  };
  const fireBriefingAction = (e, briefAction) => {
    e.stopPropagation();
    if (onAction) onAction('briefingAction', p, { briefAction });
  };
  const toggleExpand = (e) => {
    e.stopPropagation();
    setExpanded(!expanded);
  };
  const handleEnderecar = (e) => {
    e.stopPropagation();
    if (onToggleAddressed) onToggleAddressed();
  };
  const laneLabel = isAddressed ? 'endereçado' : ({ critico: 'crítico', atencao: 'atenção', rotina: 'rotina', fluxo: 'fluxo' }[p.lane]);
  const lanePillClass = isAddressed ? 'addressed' : p.lane;
  return (
    <div className={`prow ${p.lane} ${expanded ? 'expanded' : 'collapsed'} ${isAddressed ? 'addressed' : ''}`}>
      <div className={`prow-avatar ${p.avatar}`} onClick={() => onSelect(p)}>
        {isAddressed ? <span className="prow-avatar-check">✓</span> : p.initials}
      </div>
      <div className="prow-info" onClick={() => onSelect(p)}>
        <div className="prow-name-row">
          <div className="prow-name">{p.name}</div>
          <span className={`prow-lane-pill ${lanePillClass}`}>{isAddressed && '✓ '}{laneLabel}</span>
          {!expanded && !isAddressed && p.alert && <span className={`prow-alert-dot ${p.alert.kind}`} title="alerta ativo"></span>}
        </div>
        {expanded && (
          <>
            <div className="prow-meta"><strong>{p.age}a · {p.sex}</strong> · {p.phase}</div>
            <div className="prow-tags">
              {p.tags.slice(0, 4).map((t, i) => (
                <span key={i} className={`prow-tag ${t.kind}`}>{t.label}</span>
              ))}
            </div>
            {p.alert && !isAddressed && (
              <div className={`prow-briefing ${p.alert.kind}`} onClick={(e) => e.stopPropagation()}>
                <div className="prow-briefing-eye">{p.alert.eyebrow}</div>
                <div className="prow-briefing-title">{p.alert.title}</div>
                <div className="prow-briefing-pattern">{p.alert.pattern}</div>
                <div className="prow-briefing-actions">
                  {p.alert.actions.map(a => (
                    <div key={a.num} className="prow-briefing-chip" onClick={(e) => fireBriefingAction(e, a)}>
                      <span className="prow-briefing-chip-num">{a.num}</span>
                      <span>{a.label}</span>
                      <span className="prow-briefing-chip-when">{a.when}</span>
                    </div>
                  ))}
                </div>

            )}
            {p.alert && isAddressed && (
              <div className="prow-briefing addressed-briefing" onClick={(e) => e.stopPropagation()}>

            )}
            <div className="prow-actions">
              {onToggleAddressed && (
                <button className={`prow-act-enderecar ${isAddressed ? 'done' : ''}`} onClick={handleEnderecar} title={isAddressed ? 'Desfazer endereçamento' : 'Marcar como endereçado'}>
                  <span className="prow-act-enderecar-icon">{isAddressed ? '↺' : '✓'}</span>
                  <span>{isAddressed ? 'desfazer' : 'endereçar'}</span>
                </button>
              )}
              <div className={`prow-act ${p.lane === 'critico' && !isAddressed ? 'urgent' : ''}`} onClick={(e) => fireAction(e, 'video')} title="Vídeo">📹</div>
              <div className="prow-act" onClick={(e) => fireAction(e, 'call')} title="Ligar">📞</div>
              <div className="prow-act" onClick={(e) => fireAction(e, 'message')} title="Mensagem">💬</div>
              <div className="prow-act" onClick={(e) => fireAction(e, 'prescribe')} title="Prescrever">💊</div>
              <div className="prow-act" onClick={(e) => fireAction(e, 'note')} title="Nota clínica">📝</div>
              <div className="prow-act primary" onClick={(e) => { e.stopPropagation(); onSelect(p); }} title="Ver detalhes completos">👁</div>
            </div>
          </>
        )}
      </div>
      <button className="prow-expand" onClick={toggleExpand} title={expanded ? 'Recolher' : 'Expandir'}>
        <span>{expanded ? '−' : '+'}</span>
        <span className="prow-expand-label">{expanded ? 'recolher' : 'expandir'}</span>

    </div>
  );
}

// DECISOES VIEW · árvore de decisão composta
// ═══════════════════════════════════════════════════════════
function DecisoesView({ onSelect }) {
  const alerts = getCompositeAlerts();
  const [tip, setTip] = useState(null);
  const tipOn = (content) => ({
    onMouseEnter: (e) => setTip({ x: e.clientX, y: e.clientY, content }),

  });
  // 📐 ÁRVORE DE DECISÃO · regras de composição pra implementação
  // Cada alerta = combinação de triggers que JUNTOS sinalizam algo que isolados não veem.
  // Pseudo-código geral:
  //   FOR each patient p:
  //     FOR each composite_rule r:
  //       IF all_conditions(r) match p.signals:
  //         emit_alert(r, p)
  //     ORDER alerts BY urgency (urgent > warn > info)
  //     LIMIT to N most urgent for the view
  const alertRuleSpecs = {
    'urgent': {
      logic: 'Trigger ANY OF: (EA severo + medicação ativa) OR (SM 3 vermelhos + reganho ≥2%) OR (silêncio + última PHQ-9 ≥15)',
      sla: 'ação em 2 horas',
      escalation: 'enfermagem → médico em 30min se sem resposta',
      autoActions: 'criar evento Hoje · notificar pool · prefill nota com pattern'
    },
    'warn': {
      logic: 'Trigger ANY OF: (silêncio >7d + adesão caindo) OR (platô + FNQ subindo) OR (SM 2 amarelos + microcheck falhando)',
      sla: 'ação no dia',
      escalation: 'sem escalação automática · entra na pauta da reunião semanal',
      autoActions: 'criar tarefa · marcar paciente como "em atenção" no farol'
    },
    'info': {
      logic: 'Trigger ANY OF: (próximo de threshold de manutenção) OR (microcheck consistente 4+ sem) OR (FNQ estável em zona verde)',
      sla: 'revisão na próxima consulta',
      escalation: 'nenhuma',
      autoActions: 'salvar evento para próxima reunião · sugestão de transição de fase'
    }
  };
  return (
    <>
      <div className="main-head">
        <div className="main-eyebrow">Decisões clínicas priorizadas</div>
        <h1 className="main-title">Pendentes · <em>{alerts.length} briefings</em></h1>
        <div className="main-sub">Alertas compostos · combinações de triggers ordenadas por urgência clínica. <strong style={{color:'var(--moss)'}}>Hover</strong> em cada alerta ou ação para regras de composição e instruções de implementação.</div>
      </div>

      {/* 📐 PAINEL DE INSTRUÇÕES PRA O DEV · sempre visível no topo */}
      <div className="dev-panel">
        <div className="dev-panel-eye">📐 INSTRUÇÕES PARA IMPLEMENTAÇÃO · ÁRVORE DE DECISÃO COMPOSTA</div>
        <div className="dev-panel-body">
          <p><strong>Conceito:</strong> alerta composto = combinação de triggers que <em>juntos</em> revelam um padrão clínico que triggers isolados não veem. Ex: silêncio 7d isolado é "warn"; silêncio 7d + reganho 2% + SM amarelo = "urgent · ruptura iminente".</p>
          <p><strong>Pseudo-código geral:</strong></p>
          <pre className="dev-code">{`FOR each patient p IN active_cohort:
  signals = collect_signals(p, window=30d)
  // signals = { ea, sm, fnq, adherence, silence_days, ... }
  
  FOR each composite_rule r IN rules:
    IF rule_matches(r.conditions, signals):
      alert = build_alert(r, p, signals)
      alert.pattern = explain_in_human_words(r, signals)
      alert.actions = generate_action_chips(r, p.phase)
      emit(alert)
  
  ORDER alerts BY urgency DESC, age ASC
  RETURN top_N_for_view(alerts, n=12)`}</pre>
          <p><strong>3 níveis de urgência:</strong> hover em qualquer card pra ver a lógica exata daquele nível · cada chip de ação também tem instruções específicas (deep-link, modal pré-populado, etc).</p>
        </div>
      </div>

      <div className="alerts-grid">
        {alerts.map(p => {
          const spec = alertRuleSpecs[p.alert.kind] || alertRuleSpecs.warn;
          return (
            <div key={p.id} className={`alert-card ${p.alert.kind}`} onClick={() => onSelect(p)} {...tipOn({
              eye: `ALERTA · ${p.alert.kind.toUpperCase()}`,
              title: p.alert.title,

              stats: [
                { label: 'Paciente', val: p.name, kind: '' },
                { label: 'Fase', val: p.phase, kind: '' },
                { label: 'SLA', val: spec.sla, kind: p.alert.kind === 'urgent' ? 'bad' : 'warn' },
                { label: 'Lane', val: p.lane, kind: p.alert.kind === 'urgent' ? 'bad' : 'warn' }
              ],

            })}>
              <div className="alert-card-main">
                <div className="alert-card-eye">{p.alert.eyebrow}</div>
                <div className="alert-card-title">{p.alert.title}</div>

                      <span className="alert-chip-when">{a.when}</span>

                  ))}

// Helper · simple line chart component
// ═══════════════════════════════════════════════════════════
function LineChart({ data, color = 'var(--moss)', height = 90, yLabel = '', xLabels = null, max = null, showArea = true, setTip = null, pointMeta = null }) {
  const W = 460;
  const H = height;
  const padL = 36, padR = 12, padT = 8, padB = 22;
  const maxY = max !== null ? max : Math.max(...data) * 1.1;
  const minY = 0;
  const range = (maxY - minY) || 1;
  const yScale = v => padT + ((maxY - v) / range) * (H - padT - padB);
  const xScale = i => padL + (i / Math.max(1, data.length - 1)) * (W - padL - padR);
  const linePath = data.map((v, i) => `${i === 0 ? 'M' : 'L'}${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L${xScale(data.length-1)},${H-padB} L${xScale(0)},${H-padB} Z`;
  const gridSteps = 4;
  const gridY = Array.from({length: gridSteps + 1}, (_, i) => padT + (i / gridSteps) * (H - padT - padB));
  const gridVals = Array.from({length: gridSteps + 1}, (_, i) => (maxY - (i / gridSteps) * range).toFixed(1));
  const handleHover = (e, i) => {
    if (!setTip || !pointMeta || !pointMeta[i]) return;
    setTip({ x: e.clientX, y: e.clientY, content: pointMeta[i] });
  };
  const handleMove = (e) => {
    if (!setTip) return;
    setTip(prev => prev ? { ...prev, x: e.clientX, y: e.clientY } : null);
  };
  const handleLeave = () => { if (setTip) setTip(null); };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {gridY.map((y, i) => (
        <g key={i}>
          <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--line-faint)" strokeWidth="0.5" strokeDasharray="2,3" />
          <text x={padL-4} y={y+3} fontSize="9" fill="var(--ink-light)" textAnchor="end" fontFamily="JetBrains Mono">{gridVals[i]}</text>
        </g>
      ))}
      {(xLabels || data).map((v, i) => {
        const skip = Math.max(1, Math.floor(data.length / 6));
        if (i % skip !== 0 && i !== data.length - 1) return null;
        return <text key={i} x={xScale(i)} y={H-7} fontSize="9" fill="var(--ink-light)" textAnchor="middle" fontFamily="JetBrains Mono">{xLabels ? xLabels[i] : `s${i+1}`}</text>;
      })}
      {showArea && <path d={areaPath} fill={color} opacity="0.13" />}
      <path d={linePath} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      {data.map((v, i) => (
        <g key={i}>
          <circle cx={xScale(i)} cy={yScale(v)} r="2.5" fill={color} stroke="white" strokeWidth="1" />
          {pointMeta && (
            <circle
              cx={xScale(i)} cy={yScale(v)} r="11"
              fill="transparent"
              style={{cursor: 'pointer'}}
              onMouseEnter={(e) => handleHover(e, i)}
              onMouseMove={handleMove}
              onMouseLeave={handleLeave}
            />
          )}
        </g>
      ))}
      {yLabel && <text x={6} y={padT-2} fontSize="9" fill="var(--ink-light)" fontWeight="700" letterSpacing="0.06em">{yLabel}</text>}
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════
// Tooltip · floating contextual info
// ═══════════════════════════════════════════════════════════
function Tooltip({ x, y, content }) {
  if (!content) return null;
  // Position: above-right of cursor, with viewport edge handling
  const offX = 16, offY = 16;
  let left = x + offX;
  let top = y + offY;
  const W = window.innerWidth, H = window.innerHeight;
  const tipW = 300, tipH = 200;
  if (left + tipW > W - 16) left = x - tipW - offX;
  if (top + tipH > H - 16) top = y - tipH - offY;
  return (
    <div className="chart-tip" style={{left,top}}>
      {content.eye && <div className="chart-tip-eye">{content.eye}</div>}
      {content.title && <div className="chart-tip-title">{content.title}</div>}
      {content.body && <div className="chart-tip-body">{content.body}</div>}
      {content.stats && (
        <div className="chart-tip-stats">
          {content.stats.map((s, i) => (
            <div key={i} className="chart-tip-stat">
              <span className="chart-tip-stat-label">{s.label}</span>
              <span className={`chart-tip-stat-val ${s.kind || ''}`}>{s.val}</span>
            </div>
          ))}
        </div>
      )}
      {content.note && <div className="chart-tip-note">{content.note}</div>}
    </div>
  );
}

// TRIGGERS VIEW · 4-dimensional analysis
// ═══════════════════════════════════════════════════════════
function TriggersView() {
  const [tip, setTip] = useState(null);
  const tipOn = (content) => ({
    onMouseEnter: (e) => setTip({ x: e.clientX, y: e.clientY, content }),
    onMouseMove: (e) => setTip(prev => prev ? { ...prev, x: e.clientX, y: e.clientY } : null),
    onMouseLeave: () => setTip(null)
  });
  // Implementation hints per trigger · used in tooltip and exposed as data-spec for engineering
  const triggerSpecs = {
    'EA severidade ≥6': { rule: 'IF microcheck.ea_severity >= 6 THEN trigger', cooldown: '24h por paciente', actor: 'enfermagem · escalação imediata' },
    'SM 2+ vermelhos': { rule: 'IF count(sm.dimensions where state="red") >= 2 THEN trigger', cooldown: '48h', actor: 'pool clínico · qualquer membro' },
    'Silêncio >10d': { rule: 'IF days_since_last_interaction > 10 AND lane != "fluxo" THEN trigger', cooldown: '7d', actor: 'enfermagem · vídeo de escuta' },
    'Platô >4sem': { rule: 'IF weight_change_4w < 0.5kg AND phase = "titulacao" THEN trigger', cooldown: '14d', actor: 'médico · escalonar dose' },
    'Reganho ≥3%': { rule: 'IF (current_weight - nadir_weight) / nadir_weight >= 0.03 THEN trigger', cooldown: 'sem cooldown · sempre dispara', actor: 'médico · revisão urgente' }
  };
  return (
    <>
      <div className="main-head">
        <div className="main-eyebrow">Análise sistêmica · triggers 30 dias</div>
        <h1 className="main-title">Triggers <em>· 4 dimensões</em></h1>
        <div className="main-sub">Volume · recorrência · clusters · predição. Decisão final é sempre clínica. <strong style={{color:'var(--moss)'}}>Hover em qualquer item</strong> para regras técnicas e contexto clínico.</div>
      </div>

      <div className="coorte-grid">
        {/* Dimension 1 · Volume + trend */}
        <div className="coorte-block full">
          <div className="coorte-block-head">
            <div className="coorte-block-title">1 · Volume <em>+ tendência</em></div>
            <div className="coorte-block-sub">disparos ativos · 30 dias · tendência vs mês anterior · clique no nome do trigger para ver a regra de implementação</div>
          </div>
          <table className="trig-table">
            <thead>
              <tr>
                <th>Trigger</th>
                <th className="num">Ativos</th>
                <th className="num">30 dias</th>
                <th className="num">T. resol</th>
                <th className="num">Tendência</th>
              </tr>
            </thead>
            <tbody>
              {TRIGGERS_ANALYSIS.map((t, i) => {
                const spec = triggerSpecs[t.name] || { rule: 'IF condition THEN trigger', cooldown: '—', actor: 'pool · qualquer membro' };
                return (
                  <tr key={i} className={t.active > 0 ? 'has-active' : ''} {...tipOn({
                    eye: `TRIGGER · ${t.name.toUpperCase()}`,
                    title: `${t.active} ${t.active === 1 ? 'ativo' : 'ativos'} · ${t.m30} em 30d`,
                    body: `Tempo médio de resolução: ${t.resol}. Tendência ${t.trend === 'up' ? '↑ aumentando' : t.trend === 'down' ? '↓ caindo' : '→ estável'} vs mês anterior.`,
                    stats: [
                      { label: 'Ativos agora', val: t.active, kind: t.active > 0 ? 'warn' : 'good' },
                      { label: 'Disparos em 30d', val: t.m30, kind: '' },
                      { label: 'T. médio resolução', val: t.resol, kind: '' },
                      { label: 'Tendência', val: t.trend, kind: t.trend === 'up' ? 'bad' : t.trend === 'down' ? 'good' : '' }
                    ],
                    note: `📐 PARA O DEV: regra → ${spec.rule} · cooldown ${spec.cooldown} · ator: ${spec.actor}`
                  })}>
                    <td>{t.name}</td>
                    <td className={`num ${t.active > 0 ? 'has' : ''}`}>{t.active}</td>
                    <td className="num">{t.m30}</td>
                    <td className="num">{t.resol}</td>
                    <td className="num"><span className={`trig-trend ${t.trend}`}>{t.trend === 'up' ? '↑' : t.trend === 'down' ? '↓' : '→'}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Dimension 2 · Recurrence */}
        <div className="coorte-block">
          <div className="coorte-block-head">
            <div className="coorte-block-title">2 · Pacientes <em>ruidosos</em></div>
            <div className="coorte-block-sub">recorrência · 3+ triggers/mês = revisão</div>
          </div>
          <div className="recur-list">
            {RECURRENCE.map((r, i) => (
              <div key={i} className={`recur-item ${r.kind}`} {...tipOn({
                eye: `RECORRÊNCIA · ${r.name.toUpperCase()}`,
                title: `${r.count} triggers no mês · ${r.kind === 'urgent' ? 'revisão multidisciplinar' : r.kind === 'warn' ? 'monitorar' : 'normal'}`,
                body: r.detail,
                stats: [
                  { label: 'Triggers no mês', val: r.count, kind: r.count >= 4 ? 'bad' : r.count >= 3 ? 'warn' : 'good' },
                  { label: 'Threshold revisão', val: '≥ 3', kind: '' },
                  { label: 'Classificação', val: r.kind, kind: r.kind === 'urgent' ? 'bad' : r.kind === 'warn' ? 'warn' : 'good' }
                ],
                note: `📐 PARA O DEV: pacientes com ≥3 triggers/30d entram na lista de "ruidosos" · agendar revisão clínica automática · pre-fill da pauta no Hoje view.`
              })}>
                <div>
                  <div className="recur-name">{r.name}</div>
                  <div className="recur-detail">{r.detail}</div>
                </div>
                <div className="recur-count">
                  <div className={`recur-count-val ${r.kind}`}>{r.count}</div>
                  <div className="recur-count-label">triggers</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Dimension 3 · Co-occurrence */}
        <div className="coorte-block">
          <div className="coorte-block-head">
            <div className="coorte-block-title">3 · Clusters <em>detectados</em></div>
            <div className="coorte-block-sub">combinações &gt; triggers isolados</div>
          </div>
          <div className="cluster-list">
            {CLUSTERS.map((c, i) => (
              <div key={i} className={`cluster-item ${c.kind}`} {...tipOn({
                eye: `CLUSTER · CO-OCORRÊNCIA`,
                title: c.tag,
                body: `${c.count} ${c.count === 1 ? 'paciente' : 'pacientes'} com este padrão · ${c.detail}.`,
                stats: [
                  { label: 'Pacientes no cluster', val: c.count, kind: c.kind === 'urgent' ? 'bad' : c.kind === 'warn' ? 'warn' : 'good' },
                  { label: 'Severidade', val: c.kind, kind: c.kind === 'urgent' ? 'bad' : c.kind === 'warn' ? 'warn' : 'good' }
                ],
                note: `📐 PARA O DEV: cluster = match de tags simultâneas (não sequenciais) em janela 30d. Combinações têm peso maior que triggers isolados. Pode usar Apriori/FP-Growth pra descoberta de novos clusters relevantes ao longo do tempo.`
              })}>
                <div className="cluster-tag">{c.tag}</div>
                <div className="cluster-count" dangerouslySetInnerHTML={{__html: `${c.count} ${c.count === 1 ? 'paciente' : 'pacientes'} · ${c.detail}`}}></div>
              </div>
            ))}
          </div>
        </div>

        {/* Dimension 4 · Predictive */}
        <div className="coorte-block full">
          <div className="coorte-block-head">
            <div className="coorte-block-title">4 · Triggers <em>preditivos</em></div>
            <div className="coorte-block-sub">se aproximando do disparo · janela de intervenção precoce · probabilístico, não determinístico</div>
          </div>
          <div className="predict-list">
            {PREDICTIVE.map((p, i) => (
              <div key={i} className="predict-item" {...tipOn({
                eye: `PREDIÇÃO · ${p.name.toUpperCase()}`,
                title: `Estimativa: ${p.eta} até disparo`,
                body: p.detail,
                stats: [
                  { label: 'ETA até trigger', val: p.eta, kind: 'warn' },
                  { label: 'Janela de ação preventiva', val: 'agora', kind: 'good' }
                ],
                note: `📐 PARA O DEV: modelo time-to-event (Cox proportional hazards ou survival forest) · features: histórico de SM, FNQ, EA, adesão semanal. Output: hazard ratio por feature + ETA estimado. Importante: probabilidade não é certeza · sempre marcar como sinalização, não como diagnóstico.`
              })}>
                <div>
                  <div className="predict-name">{p.name}</div>
                  <div className="predict-detail">{p.detail}</div>
                </div>
                <div className="predict-eta">
                  <div className="predict-eta-val">{p.eta}</div>
                  <div className="predict-eta-label">eta</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {tip && <Tooltip x={tip.x} y={tip.y} content={tip.content} />}

// ═══════════════════════════════════════════════════════════
// HOJE VIEW · timeline of the day
// ═══════════════════════════════════════════════════════════
function HojeView() {
  const [tip, setTip] = useState(null);
  const tipOn = (content) => ({
    onMouseEnter: (e) => setTip({ x: e.clientX, y: e.clientY, content }),
    onMouseMove: (e) => setTip(prev => prev ? { ...prev, x: e.clientX, y: e.clientY } : null),
    onMouseLeave: () => setTip(null)
  });
  // Implementation hints · pra o dev quando codar de verdade
  const eventTypeSpecs = {
    'video': { source: 'Calendar API · slot reservado no Google Cal/Outlook do clínico', actor: 'médico ou enfermeira', duration: '20-30 min', preReq: 'paciente recebeu link 1h antes via SMS+email · room aberta 5min antes' },
    'check': { source: 'Cron job · executa em horários fixos do dia (8h, 12h, 18h)', actor: 'sistema · alerta humano se microcheck falha', duration: 'assíncrono', preReq: 'paciente respondeu microcheck do dia · senão dispara trigger silêncio' },
    'meeting': { source: 'Reunião recorrente · agendada semanalmente', actor: 'pool clínico completo', duration: '30-60 min', preReq: 'pauta auto-gerada com pacientes em ação + casos ruidosos' },
    'alert': { source: 'Trigger automático · sistema de regras', actor: 'enfermagem · escala', duration: 'até resolução', preReq: 'ação clínica registrada via Endereçar para fechar o alerta' },
    'admin': { source: 'Sistema · refresh de queries · backup · etc', actor: 'sistema · sem ação humana', duration: '~minutos', preReq: 'janela em horário de baixa atividade clínica' }
  };
  return (
    <>
      <div className="main-head">
        <div className="main-eyebrow">Agenda do dia · pool compartilhado</div>
        <h1 className="main-title">Hoje · <em>{TODAY.length} eventos</em></h1>
        <div className="main-sub">Timeline cronológica · quem da equipe está responsável. <strong style={{color:'var(--moss)'}}>Hover em qualquer evento</strong> para detalhes operacionais e regras de implementação.</div>
      </div>

      <div className="hoje-timeline">
        {TODAY.map((t, i) => {
          const kind = t.urgent ? 'alert' : t.dot === 'now' ? 'video' : t.title.toLowerCase().includes('reuni') ? 'meeting' : t.title.toLowerCase().includes('microcheck') || t.title.toLowerCase().includes('check') ? 'check' : t.title.toLowerCase().includes('vídeo') || t.title.toLowerCase().includes('video') ? 'video' : 'admin';
          const spec = eventTypeSpecs[kind] || eventTypeSpecs.admin;
          return (
            <div key={i} className="hoje-item">
              <div className="hoje-time">{t.time}</div>
              <div className={`hoje-dot ${t.dot}`}></div>
              <div className={`hoje-card ${t.urgent ? 'urgent' : ''} ${t.dot === 'now' ? 'now' : ''}`} {...tipOn({
                eye: `${t.time} · ${kind.toUpperCase()}`,
                title: t.title,
                body: t.detail,
                stats: [
                  { label: 'Tipo de evento', val: kind, kind: t.urgent ? 'bad' : t.dot === 'now' ? 'warn' : '' },
                  { label: 'Status', val: t.dot === 'now' ? 'agora' : t.dot === 'past' ? 'concluído' : 'agendado', kind: t.dot === 'now' ? 'warn' : t.dot === 'past' ? 'good' : '' },
                  { label: 'Ator responsável', val: spec.actor, kind: '' },
                  { label: 'Duração esperada', val: spec.duration, kind: '' }
                ],
                note: `📐 PARA O DEV: ${spec.source}. Pré-requisito: ${spec.preReq}.`
              })}>
                <div className="hoje-card-title">{t.title}</div>
                <div className="hoje-card-detail">{t.detail}</div>
              </div>
            </div>
          );
        })}
      </div>

      {tip && <Tooltip x={tip.x} y={tip.y} content={tip.content} />}
    </>
  );
}

      ),
      confirm: () => handleConfirm('Configurações salvas'),
      confirmLabel: '✓ Salvar',
      kind: 'normal'
    }
  };

  const cfg = configs[type] || configs.video;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className={`modal ${cfg.kind === 'urgent' ? 'urgent' : ''}`} onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="modal-eyebrow">{cfg.eyebrow}</div>

          <button className={`modal-btn-confirm ${cfg.kind === 'urgent' ? 'urgent' : ''}`} onClick={cfg.confirm} disabled={cfg.disabled}>
            {cfg.confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

        </div>

        <div className="exp-scenario">
          <div className="exp-scenario-label">🏷 Filtro de etiqueta clínica</div>
          <select className="exp-input" value={config.etiquetaFilter} onChange={e => updateConfig('etiquetaFilter', e.target.value)}>
            <option value="all">Todas as etiquetas</option>
            <option value="saos">Apenas SAOS</option>
            <option value="bariatrica">Apenas pós-bariátrica</option>
            <option value="menopausa">Apenas menopausa</option>
            <option value="phq">Apenas PHQ-9 ≥5</option>
            <option value="sop">Apenas SOP</option>
            <option value="dm2">Apenas DM2</option>
          </select>
        </div>

        <div className="exp-scenario">
          <div className="exp-scenario-label">💊 Filtro de molécula</div>
          <select className="exp-input" value={config.moleculaFilter} onChange={e => updateConfig('moleculaFilter', e.target.value)}>
            <option value="all">Todas as moléculas</option>
            <option value="semaglutida">Apenas semaglutida</option>
            <option value="tirzepatida">Apenas tirzepatida</option>
            <option value="liraglutida">Apenas liraglutida</option>
            <option value="bupropiona">Bupropiona+naltrexona</option>
            <option value="suspenso">Pacientes com medicação suspensa</option>
          </select>
        </div>

        <div className="exp-scenario">
          <div className="exp-scenario-label">⚧ Filtro de sexo biológico</div>
          <select className="exp-input" value={config.sexoFilter} onChange={e => updateConfig('sexoFilter', e.target.value)}>
            <option value="all">Ambos os sexos</option>
            <option value="F">Apenas feminino</option>
            <option value="M">Apenas masculino</option>
          </select>
        </div>

        <div className="exp-scenario">
          <div className="exp-scenario-label">🎂 Filtro de faixa etária</div>
          <select className="exp-input" value={config.idadeFilter} onChange={e => updateConfig('idadeFilter', e.target.value)}>
            <option value="all">Todas as idades</option>
            <option value="under25">&lt; 25 anos (início precoce)</option>
            <option value="25-45">25-45 anos</option>
            <option value="45-60">45-60 anos</option>
            <option value="over60">&gt; 60 anos</option>
          </select>
        </div>

        <div className="exp-scenario">
          <div className="exp-scenario-label">👨‍⚕ Filtro por clínico responsável</div>
          <select className="exp-input" value={config.clinicianFilter} onChange={e => updateConfig('clinicianFilter', e.target.value)}>
            <option value="all">Todos os clínicos</option>
            <option value="renato">Dr Renato (médico)</option>
            <option value="carla">Enf Carla (enfermeira)</option>
            <option value="julia">Nutri Júlia (nutricionista)</option>
          </select>
        </div>
      </div>

      <div className="exp-divider"></div>

      <div className="exp-section-title">
        <span>⚖ Comparações · adicione ao relatório</span>
        <span className="exp-counter">cada comparação vira uma seção dedicada</span>
      </div>
      <div className="exp-checks">
        {[
          { id: 'cmp_surmount_full', label: 'vs SURMOUNT-1 (tirzepatida 15mg)', desc: 'response rates · DP · retenção · todos os thresholds' },
          { id: 'cmp_step_full', label: 'vs STEP-1 (semaglutida 2.4mg)', desc: 'comparação completa com trial pivotal' },
          { id: 'cmp_internal', label: 'vs trimestre anterior (mesma coorte)', desc: 'evolução temporal · Δ% por métrica' },
          { id: 'cmp_safra', label: 'Comparação entre safras (cohorts de entrada)', desc: 'compara cohortes que iniciaram em meses diferentes' },
          { id: 'cmp_subgroups', label: 'Subgrupos entre si (head-to-head)', desc: 'ex: SOP vs menopausa · qual responde mais?' }
        ].map(c => (
          <label key={c.id} className={`exp-check ${config.compareWith.has(c.id) ? 'on' : ''}`}>
            <input type="checkbox" checked={config.compareWith.has(c.id)} onChange={() => toggleCompare(c.id)} />
            <div>
              <div className="exp-check-label">{c.label}</div>
              <div className="exp-check-desc">{c.desc}</div>
            </div>
          </label>
        ))}
      </div>

      <div className="exp-divider"></div>

      <div className="exp-section-title"><span>🎨 Formato, audiência e privacidade</span></div>
      <div className="exp-scenario-grid">
        <div className="exp-scenario">
          <div className="exp-scenario-label">Formato de entrega</div>
          <select className="exp-input" value={config.format} onChange={e => updateConfig('format', e.target.value)}>
            <option value="pdf">PDF · documento formatado</option>
            <option value="html">HTML interativo · com hovers</option>
            <option value="pptx">PowerPoint · pra apresentação</option>
            <option value="xlsx">Excel · planilhas e dados brutos</option>
            <option value="csv">CSV · apenas dados</option>
          </select>
        </div>
        <div className="exp-scenario">
          <div className="exp-scenario-label">Audiência (calibra linguagem e nível técnico)</div>
          <select className="exp-input" value={config.audience} onChange={e => updateConfig('audience', e.target.value)}>
            <option value="clinical">Clínica · linguagem técnica padrão</option>
            <option value="executive">Executivo · resumo + decisões</option>
            <option value="scientific">Científico · com IC, p-values, metodologia</option>
            <option value="operational">Operacional · foco em SLA e equipe</option>
            <option value="patient">Paciente-friendly · linguagem simples</option>
            <option value="regulatory">Regulatório · pra ANVISA/ANS</option>
          </select>
        </div>
        <div className="exp-scenario">
          <div className="exp-scenario-label">Pseudonimização / privacidade</div>
          <select className="exp-input" value={config.anonymization} onChange={e => updateConfig('anonymization', e.target.value)}>
            <option value="none">Identificado · interno · com nomes</option>
            <option value="partial">Parcial · iniciais + ID</option>
            <option value="full">Total · só agregados</option>
            <option value="research">Pesquisa · k-anonimato ≥5</option>
          </select>
        </div>
        <div className="exp-scenario">
          <div className="exp-scenario-label">Idioma</div>
          <select className="exp-input" value={config.language} onChange={e => updateConfig('language', e.target.value)}>
            <option value="pt">Português (Brasil)</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>

      <div className="exp-toggles">
        <label className="exp-toggle">
          <input type="checkbox" checked={config.includeCharts} onChange={e => updateConfig('includeCharts', e.target.checked)} />
          <span>Incluir gráficos e visualizações</span>
        </label>
        <label className="exp-toggle">
          <input type="checkbox" checked={config.includeRawData} onChange={e => updateConfig('includeRawData', e.target.checked)} />
          <span>Anexar dados brutos (CSV)</span>
        </label>
        <label className="exp-toggle">
          <input type="checkbox" checked={config.includeIndividualPatients} onChange={e => updateConfig('includeIndividualPatients', e.target.checked)} />
          <span>Incluir trajetórias individuais por paciente (apenas se identificado)</span>
        </label>
      </div>
    </div>
  );

  // ═══ STEP 3 · Preview ═══
  const renderStep3 = () => {
    const filterDesc = [];
    if (config.laneFilter !== 'all') filterDesc.push(`farol: ${config.laneFilter}`);
    if (config.phaseFilter !== 'all') filterDesc.push(`fase: ${config.phaseFilter}`);
    if (config.etiquetaFilter !== 'all') filterDesc.push(`etiqueta: ${config.etiquetaFilter}`);
    if (config.moleculaFilter !== 'all') filterDesc.push(`molécula: ${config.moleculaFilter}`);
    if (config.sexoFilter !== 'all') filterDesc.push(`sexo: ${config.sexoFilter}`);
    if (config.idadeFilter !== 'all') filterDesc.push(`idade: ${config.idadeFilter}`);
    if (config.clinicianFilter !== 'all') filterDesc.push(`clínico: ${config.clinicianFilter}`);

    return (
      <div>
        <div className="exp-section-title">
          <span>👁 Preview · revise antes de aprovar</span>
          <span className="exp-counter">~{totalPages} páginas · {config.format.toUpperCase()} · {config.anonymization}</span>
        </div>

        <div className="exp-preview-doc">
          <div className="exp-preview-watermark">{config.watermark}</div>
          <div className="exp-preview-cover">
            <div className="exp-preview-eye">RELATÓRIO DE COORTE</div>
            <h2>Programa de Obesidade · Análise periódica</h2>
            <div className="exp-preview-meta">
              <div><strong>Período:</strong> {{'last7':'últimos 7 dias','last30':'últimos 30 dias','last90':'últimos 90 dias','last180':'últimos 6 meses','last365':'últimos 12 meses','ytd':'ano até hoje','all':'toda a coorte','custom':`${config.customStart} a ${config.customEnd}`}[config.period]}</div>
              <div><strong>Coorte:</strong> N=47 pacientes ({COHORT.active} ativos)</div>
              <div><strong>Audiência:</strong> {config.audience}</div>
              <div><strong>Pseudonimização:</strong> {config.anonymization}</div>
              {filterDesc.length > 0 && <div><strong>Filtros:</strong> {filterDesc.join(' · ')}</div>}
              <div><strong>Gerado em:</strong> {new Date().toLocaleString('pt-BR')}</div>
            </div>
          </div>

          <div className="exp-preview-toc">
            <div className="exp-preview-toc-title">Índice · {selectedItems.length} seções</div>
            <ol>
              {selectedItems.map((item, i) => (
                <li key={item.id}>
                  <span>{item.label}</span>
                  <span className="exp-preview-toc-page">pg {i + 2}</span>
                </li>
              ))}
              {[...config.compareWith].map((id, i) => (
                <li key={id}>
                  <span>Comparação · {id.replace('cmp_', '').replace('_', ' ')}</span>
                  <span className="exp-preview-toc-page">pg {selectedItems.length + i + 2}</span>
                </li>
              ))}
            </ol>
          </div>

          {selectedItems.slice(0, 3).map(item => (
            <div key={item.id} className="exp-preview-section">
              <div className="exp-preview-section-num">{(selectedItems.indexOf(item) + 1).toString().padStart(2, '0')}</div>
              <div className="exp-preview-section-content">
                <div className="exp-preview-section-eye">SEÇÃO</div>
                <div className="exp-preview-section-title">{item.label}</div>
                <div className="exp-preview-section-snippet">{item.desc}</div>
                {config.includeCharts && <div className="exp-preview-chart-placeholder">📊 [gráfico interativo será renderizado aqui]</div>}
              </div>
            </div>
          ))}
          {selectedItems.length > 3 && (
            <div className="exp-preview-more">+ {selectedItems.length - 3} seções adicionais serão incluídas no relatório completo</div>
          )}
        </div>

        <div className="exp-preview-actions">
          <button className="exp-btn-secondary" onClick={() => setStep(1)}>← Voltar para ajustar seleção</button>
          <button className="exp-btn-secondary" onClick={() => setStep(2)}>← Voltar para cenários</button>
        </div>
      </div>
    );
  };

  // ═══ STEP 4 · Email / agendamento ═══
  const renderStep4 = () => (
    <div>
      <div className="exp-section-title">
        <span>📧 Envio e agendamento</span>
        <span className="exp-counter">configure destinatários e frequência</span>
      </div>

      <div className="exp-field">
        <label>Destinatários (separe por vírgula)</label>
        <textarea
          className="exp-input"
          value={config.recipients}
          onChange={e => updateConfig('recipients', e.target.value)}
          rows={2}
          placeholder="renato@clinica.com.br, leadership@empresa.com, advisory@empresa.com"
        />
        <div className="exp-helper">{config.recipients.split(',').filter(s => s.trim()).length} destinatário(s)</div>
      </div>

      <div className="exp-field">
        <label>Assunto</label>
        <input
          type="text"
          className="exp-input"
          value={config.subject}
          onChange={e => updateConfig('subject', e.target.value)}
        />
      </div>

      <div className="exp-field">
        <label>Mensagem (vai no corpo do email)</label>
        <textarea
          className="exp-input"
          value={config.message}
          onChange={e => updateConfig('message', e.target.value)}
          rows={5}
        />
      </div>

      <div className="exp-divider"></div>

      <div className="exp-section-title"><span>🔄 Frequência</span></div>
      <div className="exp-radio-grid">
        {[
          { id: 'once', label: 'Enviar agora · uma vez', icon: '📤' },
          { id: 'scheduled', label: 'Agendar envio para data específica', icon: '📅' },
          { id: 'weekly', label: 'Recorrente · toda segunda 8h', icon: '🔁' },
          { id: 'monthly', label: 'Recorrente · todo dia 1º do mês', icon: '🔁' },
          { id: 'quarterly', label: 'Recorrente · trimestral', icon: '🔁' }
        ].map(f => (
          <label key={f.id} className={`exp-radio ${config.scheduling === f.id ? 'on' : ''}`}>
            <input type="radio" name="freq" checked={config.scheduling === f.id} onChange={() => updateConfig('scheduling', f.id)} />
            <span className="exp-radio-icon">{f.icon}</span>
            <span>{f.label}</span>
          </label>
        ))}
      </div>

      {config.scheduling === 'scheduled' && (
        <div className="exp-field">
          <label>Data e hora do envio</label>
          <input type="datetime-local" className="exp-input" value={config.scheduledFor} onChange={e => updateConfig('scheduledFor', e.target.value)} />
        </div>
      )}

      <div className="exp-divider"></div>

      <div className="exp-summary-card">
        <div className="exp-summary-title">📋 Resumo do envio</div>
        <div className="exp-summary-row"><strong>{selectedItems.length} seções</strong> · ~{totalPages} páginas</div>
        <div className="exp-summary-row"><strong>{config.format.toUpperCase()}</strong> · audiência: {config.audience} · idioma: {config.language}</div>
        <div className="exp-summary-row"><strong>Privacidade:</strong> {config.anonymization}</div>
        <div className="exp-summary-row"><strong>Para:</strong> {config.recipients || '— defina destinatários acima —'}</div>
        <div className="exp-summary-row"><strong>Quando:</strong> {{'once':'envio imediato','scheduled':`agendado: ${config.scheduledFor || '—'}`,'weekly':'recorrente semanal','monthly':'recorrente mensal','quarterly':'recorrente trimestral'}[config.scheduling]}</div>
      </div>
    </div>
  );

  // ═══ HANDLER FINAL ═══
  const handleSend = () => {
    const recipientCount = config.recipients.split(',').filter(s => s.trim()).length;
    const verb = config.scheduling === 'once' ? 'enviado para' : 'agendado para envio para';
    onConfirm(`Relatório ${verb} ${recipientCount} destinatário${recipientCount === 1 ? '' : 's'} · ${selectedItems.length} seções · ${config.format.toUpperCase()}`);
  };

  // ═══ RENDER ═══
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal exp-modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="modal-eyebrow">EXPORTAR RELATÓRIO · 4 ETAPAS</div>
            <div className="modal-title">{['Selecionar análises', 'Cenários e variáveis', 'Preview do relatório', 'Envio e agendamento'][step - 1]}</div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>

        {/* Stepper */}
        <div className="exp-stepper">
          {[1, 2, 3, 4].map(n => (
            <div key={n} className={`exp-step ${step === n ? 'active' : ''} ${step > n ? 'done' : ''}`}>
              <div className="exp-step-num">{step > n ? '✓' : n}</div>
              <div className="exp-step-label">{['Selecionar', 'Cenários', 'Preview', 'Envio'][n - 1]}</div>
            </div>
          ))}
        </div>

        <div className="modal-body exp-body">
          {step === 1 && renderStep1()}
          {step === 2 && renderStep2()}
          {step === 3 && renderStep3()}
          {step === 4 && renderStep4()}
        </div>

        <div className="modal-footer">
          <button className="modal-btn-cancel" onClick={onClose}>Cancelar</button>
          {step > 1 && <button className="modal-btn-cancel" onClick={() => setStep(step - 1)}>← Voltar</button>}
          {step < 4 ? (
            <button className="modal-btn-confirm" onClick={() => setStep(step + 1)} disabled={step === 1 ? !canProceedStep1 : step === 2 ? !canProceedStep2 : false}>
              {step === 3 ? '✓ Aprovar e ir pra envio →' : 'Próximo →'}
            </button>
          ) : (
            <button className="modal-btn-confirm" onClick={handleSend} disabled={!canProceedStep4}>
              📧 {config.scheduling === 'once' ? 'Enviar agora' : 'Agendar envio'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
