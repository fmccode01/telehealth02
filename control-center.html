<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Controle · obesidade</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --parchment: #FAF7F2;
  --parchment-warm: #F1ECE2;
  --bone: #FDFCFA;
  --ink-deep: #1F1B16;
  --ink-mid: #4A4338;
  --ink-light: #8A8074;
  --moss: #5C7544;
  --moss-light: #95D085;
  --moss-bg: #E8EFDF;
  --sienna: #B5663A;
  --amber: #C89C46;
  --amber-bg: #F5E9CC;
  --rust: #A04830;
  --rust-bg: #F3DCD2;
  --slate: #5F6B7C;
  --plum: #7D5A7C;
  --plum-bg: #EBE0EA;
  --teal: #4A8B82;
  --teal-bg: #DCEBE8;
  --line-faint: #E8E0D2;
  --line-mid: #D5CCB8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Source Sans 3', sans-serif;
  background: var(--parchment);
  color: var(--ink-deep);
  font-size: 13.5px;
  line-height: 1.5;
  overflow: hidden;
}
#root { height: 100vh; display: flex; flex-direction: column; }

/* ===== TOPBAR ===== */
.topbar {
  height: 52px;
  background: var(--parchment-warm);
  color: var(--ink-deep);
  display: flex; align-items: center;
  padding: 0 22px;
  flex-shrink: 0;
  gap: 16px;
  border-bottom: 1px solid var(--line-mid);
}
.topbar-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  display: flex; align-items: center; gap: 6px;
}
.topbar-brand strong { font-weight: 500; font-style: normal; color: var(--ink-deep); }
.topbar-brand em { font-style: italic; color: var(--moss); }
.topbar-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-light);
  margin-left: 24px;
  letter-spacing: 0.04em;
}
.topbar-spacer { flex: 1; }

/* PROMINENT SEARCH in topbar · always visible · open field */
.topbar-search {
  position: relative;
  display: flex;
  align-items: center;
  background: white;
  border: 1.5px solid var(--line-mid);
  border-radius: 9px;
  padding: 0 12px 0 38px;
  height: 36px;
  width: 320px;
  flex-shrink: 0;
  transition: all 0.15s;
}
.topbar-search:focus-within {
  border-color: var(--ink-deep);
  box-shadow: 0 0 0 3px rgba(31,27,22,0.08);
}
.topbar-search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.55;
  pointer-events: none;
}
.topbar-search input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink-deep);
  min-width: 0;
}
.topbar-search input::placeholder {
  color: var(--ink-light);
  font-style: italic;
}
.topbar-search-count {
  font-size: 10.5px;
  color: var(--moss);
  font-weight: 700;
  font-style: italic;
  letter-spacing: 0.04em;
  white-space: nowrap;
  margin-right: 5px;
}
.topbar-search-clear {
  width: 22px; height: 22px;
  border: none;
  background: var(--bone);
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  color: var(--ink-mid);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.12s;
}
.topbar-search-clear:hover {
  background: var(--ink-deep);
  color: var(--parchment);
}
@media (max-width: 1200px) {
  .topbar-search { width: 240px; }
  .topbar-time { display: none; }
}
.topbar-btn {
  position: relative;
  height: 34px;
  display: flex; align-items: center; gap: 7px;
  padding: 0 11px;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  color: var(--ink-deep);
  transition: all 0.15s;
}
.topbar-btn:hover { border-color: var(--ink-deep); transform: translateY(-1px); }
.topbar-btn.active { background: var(--ink-deep); color: var(--parchment); border-color: var(--ink-deep); }
.topbar-btn-icon { font-size: 13px; }
.topbar-btn-label {
  font-size: 11px;
  font-weight: 600;
}
.topbar-btn-badge {
  font-size: 9px;
  font-weight: 700;
  background: var(--rust);
  color: white;
  border-radius: 99px;
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
}
.topbar-btn-badge.amber { background: var(--amber); }
.topbar-btn-badge.moss { background: var(--moss); }
.topbar-notif {
  position: relative;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s;
}
.topbar-notif:hover { border-color: var(--ink-deep); transform: translateY(-1px); }
.topbar-notif-badge {
  position: absolute;
  top: -3px; right: -3px;
  background: var(--rust);
  color: white;
  border-radius: 99px;
  min-width: 16px;
  height: 16px;
  font-size: 9.5px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  border: 1.5px solid var(--parchment-warm);
}
.topbar-user {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 11px 4px 5px;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 99px;
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
}
.topbar-user:hover { border-color: var(--ink-deep); transform: translateY(-1px); }
.topbar-user-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  color: white;
}
.topbar-user-avatar.medico { background: var(--moss); }
.topbar-user-avatar.enfermeira { background: var(--teal); }
.topbar-user-avatar.nutri { background: var(--sienna); }
.topbar-user-info { display: flex; flex-direction: column; }
.topbar-user-name {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-deep);
  line-height: 1.1;
}
.topbar-user-role {
  font-size: 9px;
  color: var(--ink-light);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1.1;
  margin-top: 1px;
}
.topbar-user-chev { color: var(--ink-light); font-size: 10px; }
.user-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 9px;
  box-shadow: 0 10px 30px rgba(31,27,22,0.18);
  width: 280px;
  z-index: 1000;
  overflow: hidden;
}
.user-dropdown.wide { width: 340px; max-height: 480px; overflow-y: auto; }
.user-dropdown-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--ink-light);
  padding: 11px 13px 7px;
  text-transform: uppercase;
}
.user-dropdown-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 13px;
  cursor: pointer;
  transition: background 0.12s;
}
.user-dropdown-item:hover { background: var(--bone); }
.user-dropdown-item.active { background: var(--moss-bg); }
.user-dropdown-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: white;
}
.user-dropdown-avatar.medico { background: var(--moss); }
.user-dropdown-avatar.enfermeira { background: var(--teal); }
.user-dropdown-avatar.nutri { background: var(--sienna); }
.user-dropdown-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-deep);
  line-height: 1.2;
}
.user-dropdown-role {
  font-size: 10px;
  color: var(--ink-mid);
  line-height: 1.2;
}
.user-dropdown-divider { height: 1px; background: var(--line-faint); margin: 4px 0; }

/* ===== SCENE LAYOUT ===== */
.scene { flex: 1; display: flex; overflow: hidden; }

/* ===== SIDEBAR LEFT ===== */
.sidebar-left {
  width: 240px;
  background: var(--parchment);
  border-right: 1px solid var(--line-mid);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sl-head {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line-faint);
}
.sl-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  font-weight: 500;
}
.sl-title em { font-style: italic; color: var(--moss); }
.sl-subtitle {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 2px;
}
.sl-search {
  margin-top: 10px;
  position: relative;
}
.sl-search input {
  width: 100%;
  background: var(--bone);
  border: 1px solid var(--line-mid);
  border-radius: 7px;
  padding: 7px 10px 7px 28px;
  font-size: 12px;
  font-family: inherit;
}
.sl-search input:focus { outline: none; border-color: var(--moss); }
.sl-search::before {
  content: '🔍';
  position: absolute;
  left: 9px; top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  opacity: 0.5;
}
.sl-body { flex: 1; overflow-y: auto; padding-bottom: 16px; }
.sl-section {
  padding: 12px 14px 5px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.sl-nav { padding: 0 8px; display: flex; flex-direction: column; gap: 1px; }
.sl-item {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 9px;
  align-items: center;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
  background: transparent;
  border: none;
  font-family: inherit;
  text-align: left;
  color: var(--ink-mid);
  transition: background 0.12s;
}
.sl-item:hover { background: var(--bone); }
.sl-item.active {
  background: var(--parchment-warm);
  color: var(--ink-deep);
  border-left: 2px solid var(--ink-deep);
  padding-left: 8px;
}
.sl-item-icon { font-size: 13px; text-align: center; }
.sl-item-label { font-size: 12px; }
.sl-item-badge {
  font-size: 9px;
  font-weight: 700;
  background: var(--parchment-warm);
  color: var(--ink-deep);
  border-radius: 7px;
  padding: 1px 6px;
  min-width: 16px;
  text-align: center;
}
.sl-item.active .sl-item-badge {
  background: var(--ink-deep);
  color: var(--parchment);
}
.sl-item-badge.urgent { background: var(--rust); color: white; }
.sl-item-badge.warn { background: var(--amber); color: white; }
.sl-divider { height: 1px; background: var(--line-faint); margin: 8px 14px; }

/* PRIMARY BIG BUTTONS · Ação + Todos */
.sl-primary {
  padding: 4px 12px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sl-primary-btn {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 11px;
  align-items: center;
  padding: 11px 12px;
  border-radius: 9px;
  background: white;
  border: 1px solid var(--line-mid);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all 0.15s ease;
  position: relative;
}
.sl-primary-btn:hover {
  border-color: var(--ink-deep);
  transform: translateY(-1px);
  box-shadow: 0 3px 9px rgba(31,27,22,0.08);
}
.sl-primary-btn.active {
  background: var(--parchment-warm);
  border-color: var(--ink-deep);
  border-width: 2px;
  padding: 10px 11px;
}
.sl-primary-btn.acao { border-left: 3px solid var(--rust); }
.sl-primary-btn.acao.active {
  background: linear-gradient(90deg, var(--rust-bg) 0%, var(--bone) 60%);
  border-left: 3px solid var(--rust);
  border-color: var(--rust);
}
.sl-primary-btn.todos { border-left: 3px solid var(--moss); }
.sl-primary-btn.todos.active {
  background: linear-gradient(90deg, var(--moss-bg) 0%, var(--bone) 60%);
  border-left: 3px solid var(--moss);
  border-color: var(--moss);
}
.sl-primary-icon {
  width: 32px; height: 32px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.sl-primary-btn.acao .sl-primary-icon { background: var(--rust-bg); }
.sl-primary-btn.acao.active .sl-primary-icon { background: var(--rust); color: white; }
.sl-primary-btn.todos .sl-primary-icon { background: var(--moss-bg); }
.sl-primary-btn.todos.active .sl-primary-icon { background: var(--moss); color: white; }
.sl-primary-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.sl-primary-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  font-weight: 500;
  line-height: 1;
  color: var(--ink-deep);
}
.sl-primary-sub {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 4px;
}
.sl-primary-count {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--ink-deep);
  line-height: 1;
}
.sl-primary-btn.acao .sl-primary-count { color: var(--rust); }
.sl-primary-btn.todos .sl-primary-count { color: var(--moss); }

/* ===== MAIN AREA ===== */
.main {
  flex: 1;
  overflow-y: auto;
  background: var(--parchment);
  display: flex;
  flex-direction: column;
}
.main-pulse {
  background: var(--bone);
  color: var(--ink-deep);
  padding: 13px 26px;
  display: flex;
  align-items: center;
  gap: 22px;
  font-size: 11.5px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line-faint);
}
.pulse-stat {
  display: flex; align-items: baseline; gap: 6px;
}
.pulse-stat-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 21px;
  color: var(--ink-deep);
  line-height: 1;
}
.pulse-stat-val.crit { color: var(--rust); }
.pulse-stat-val.attn { color: var(--amber); }
.pulse-stat-val.routine { color: var(--slate); }
.pulse-stat-val.flow { color: var(--moss); }
.pulse-stat-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.pulse-divider { width: 1px; height: 22px; background: var(--line-mid); }
.pulse-spacer { flex: 1; }
.pulse-sla {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px;
  color: var(--ink-mid);
}
.pulse-sla strong { color: var(--ink-deep); font-weight: 700; }

.main-content { flex: 1; padding: 22px 26px 60px; }
.main-head { margin-bottom: 18px; }
.main-eyebrow {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.main-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 500;
  margin-top: 4px;
}
.main-title em { font-style: italic; color: var(--moss); }
.main-sub {
  font-size: 13px;
  color: var(--ink-mid);
  margin-top: 5px;
}

/* ===== COMPOSITE ALERTS ===== */
.alerts-section { margin-bottom: 28px; }
.alerts-section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line-faint);
}
.alerts-section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 500;
}
.alerts-section-title em { font-style: italic; color: var(--rust); }
.alerts-count {
  font-size: 10px;
  color: var(--ink-light);
  font-weight: 600;
  letter-spacing: 0.06em;
}
.alerts-grid { display: flex; flex-direction: column; gap: 11px; }
.alert-card {
  background: white;
  color: var(--ink-deep);
  border: 1px solid var(--line-mid);
  border-radius: 11px;
  padding: 15px 19px;
  display: flex;
  gap: 14px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.alert-card:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(31,27,22,0.08); }
.alert-card.urgent {
  background: linear-gradient(90deg, var(--rust-bg) 0%, white 40%);
  border-left: 4px solid var(--rust);
}
.alert-card.warn {
  background: linear-gradient(90deg, var(--amber-bg) 0%, white 40%);
  border-left: 4px solid var(--amber);
}
.alert-card.celebrate {
  background: linear-gradient(90deg, var(--moss-bg) 0%, white 40%);
  border-left: 4px solid var(--moss);
}
.alert-card-main { flex: 1; min-width: 0; }
.alert-card-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 6px;
  color: var(--ink-light);
}
.alert-card.urgent .alert-card-eye { color: var(--rust); }
.alert-card.warn .alert-card-eye { color: #8B6817; }
.alert-card.celebrate .alert-card-eye { color: var(--moss); }
.alert-card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 500;
  line-height: 1.25;
  margin-bottom: 6px;
  color: var(--ink-deep);
}
.alert-card-title em { font-style: italic; }
.alert-card.urgent .alert-card-title em { color: var(--rust); }
.alert-card.warn .alert-card-title em { color: #8B6817; }
.alert-card.celebrate .alert-card-title em { color: var(--moss); }
.alert-card-pattern {
  font-size: 12px;
  color: var(--ink-mid);
  margin-bottom: 10px;
  font-style: italic;
  line-height: 1.45;
}
.alert-card-actions {
  display: flex; gap: 7px; flex-wrap: wrap;
}
.alert-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--ink-deep);
  cursor: pointer;
  transition: all 0.12s;
}
.alert-chip:hover { background: var(--ink-deep); color: var(--parchment); border-color: var(--ink-deep); }
.alert-chip-num {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  font-weight: 700;
  color: white;
}
.alert-card.urgent .alert-chip-num { background: var(--rust); }
.alert-card.warn .alert-chip-num { background: var(--amber); }
.alert-card.celebrate .alert-chip-num { background: var(--moss); }
.alert-chip-when {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
}

/* ===== LANES ===== */
.lane { margin-bottom: 22px; }
.lane-head {
  display: flex; align-items: center; gap: 9px;
  margin-bottom: 9px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line-faint);
}
.lane-icon { font-size: 13px; }
.lane-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 500;
}
.lane-title em { font-style: italic; }
.lane-count {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.lane-rule {
  flex: 1;
  font-size: 10.5px;
  color: var(--ink-light);
  font-style: italic;
  text-align: right;
}
.lane-empty {
  font-size: 11.5px;
  color: var(--ink-light);
  font-style: italic;
  text-align: center;
  padding: 14px;
  background: var(--bone);
  border-radius: 8px;
  border: 1px dashed var(--line-mid);
}

/* ===== PATIENT ROW · simplified · cards just show identity + tags + actions ===== */
.prow-list { display: flex; flex-direction: column; gap: 8px; }
.prow {
  background: white;
  border: 1px solid var(--line-faint);
  border-left: 4px solid var(--line-mid);
  border-radius: 0 11px 11px 0;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: background 0.12s, box-shadow 0.15s;
}
.prow.collapsed {
  padding: 10px 16px;
}
.prow.expanded {
  padding: 13px 16px;
  align-items: flex-start;
  box-shadow: 0 2px 10px rgba(31,27,22,0.05);
}
.prow:hover { box-shadow: 0 3px 14px rgba(31,27,22,0.08); }
.prow.critico { border-left-color: var(--rust); }
.prow.atencao { border-left-color: var(--amber); }
.prow.rotina { border-left-color: var(--slate); }
.prow.fluxo { border-left-color: var(--moss); }

/* Addressed state · checked off task */
.prow.addressed {
  background: linear-gradient(90deg, var(--moss-bg) 0%, white 30%);
  border-left-color: var(--moss) !important;
}
.prow.addressed .prow-name {
  color: var(--moss);
  text-decoration: line-through;
  text-decoration-color: rgba(92, 117, 68, 0.4);
  text-decoration-thickness: 1.5px;
}
.prow-avatar-check {
  font-size: 22px;
  font-weight: 700;
}
.prow.addressed .prow-avatar {
  background: var(--moss) !important;
  position: relative;
}
.prow.addressed .prow-lane-pill { background: var(--moss) !important; color: white !important; }
.prow-lane-pill.addressed { background: var(--moss); color: white; }

.addressed-lane {
  opacity: 0.95;
}
.addressed-lane .lane-head {
  border-bottom-color: var(--moss);
}

.prow-briefing.addressed-briefing {
  background: linear-gradient(135deg, var(--moss-bg) 0%, white 60%);
  border-left-color: var(--moss);
}

/* Endereçar button · prominent green */
.prow-act-enderecar {
  display: flex; align-items: center; gap: 6px;
  height: 32px;
  padding: 0 11px;
  background: var(--moss);
  color: white;
  border: 1.5px solid var(--moss);
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: all 0.15s;
  margin-right: 4px;
}
.prow-act-enderecar:hover {
  background: #4A6336;
  transform: translateY(-1px);
  box-shadow: 0 3px 9px rgba(92, 117, 68, 0.3);
}
.prow-act-enderecar-icon {
  font-size: 14px;
  font-weight: 700;
}
.prow-act-enderecar.done {
  background: white;
  color: var(--ink-mid);
  border-color: var(--line-mid);
}
.prow-act-enderecar.done:hover {
  background: var(--bone);
  color: var(--ink-deep);
  border-color: var(--ink-deep);
}
.prow-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  color: white;
  font-weight: 400;
  flex-shrink: 0;
  cursor: pointer;
}
.prow.expanded .prow-avatar { width: 44px; height: 44px; font-size: 17px; }
.prow-avatar.moss { background: var(--moss); }
.prow-avatar.sienna { background: var(--sienna); }
.prow-avatar.plum { background: var(--plum); }
.prow-avatar.teal { background: var(--teal); }
.prow-avatar.amber { background: var(--amber); }
.prow-info { flex: 1; min-width: 0; cursor: pointer; }
.prow-name-row {
  display: flex; align-items: center; gap: 9px;
}
.prow.expanded .prow-name-row { margin-bottom: 3px; }
.prow-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 500;
  line-height: 1.15;
}
.prow.collapsed .prow-name { font-size: 16px; }
.prow-lane-pill {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--parchment-warm);
  color: var(--ink-mid);
  white-space: nowrap;
}
.prow-lane-pill.critico { background: var(--rust); color: white; }
.prow-lane-pill.atencao { background: var(--amber); color: white; }
.prow-lane-pill.rotina { background: var(--slate); color: white; }
.prow-lane-pill.fluxo { background: var(--moss); color: white; }
.prow-alert-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--rust);
  animation: pulse-dot 1.8s ease-in-out infinite;
  margin-left: 4px;
}
.prow-alert-dot.warn { background: var(--amber); }
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.55; }
}
.prow-meta {
  font-size: 11.5px;
  color: var(--ink-light);
  margin-bottom: 6px;
}
.prow-meta strong { color: var(--ink-mid); font-weight: 600; }
.prow-tags {
  display: flex; gap: 5px; flex-wrap: wrap;
  margin-bottom: 6px;
}
.prow-tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--parchment-warm);
  color: var(--ink-mid);
}
.prow-tag.urgent { background: var(--rust-bg); color: var(--rust); }
.prow-tag.warn { background: var(--amber-bg); color: #8B6817; }
.prow-tag.good { background: var(--moss-bg); color: var(--moss); }
.prow-tag.plum { background: var(--plum-bg); color: var(--plum); }
.prow-tag.teal { background: var(--teal-bg); color: var(--teal); }
.prow-alert {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 11.5px;
  margin-top: 2px;
}
.prow-alert.urgent {
  background: linear-gradient(90deg, var(--rust-bg) 0%, var(--rust-bg) 70%, transparent);
  color: var(--rust);
  font-weight: 600;
}
.prow-alert.warn {
  background: linear-gradient(90deg, var(--amber-bg) 0%, var(--amber-bg) 70%, transparent);
  color: #8B6817;
  font-weight: 600;
}
.prow-alert.celebrate {
  background: linear-gradient(90deg, var(--moss-bg) 0%, var(--moss-bg) 70%, transparent);
  color: var(--moss);
  font-weight: 600;
}
.prow-alert-icon { font-size: 11px; }

/* Full briefing inside expanded row */
.prow-briefing {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--bone), white);
  border: 1px solid var(--line-faint);
  border-left: 4px solid var(--line-mid);
}
.prow-briefing.urgent {
  background: linear-gradient(135deg, var(--rust-bg) 0%, white 60%);
  border-left-color: var(--rust);
}
.prow-briefing.warn {
  background: linear-gradient(135deg, var(--amber-bg) 0%, white 60%);
  border-left-color: var(--amber);
}
.prow-briefing.celebrate {
  background: linear-gradient(135deg, var(--moss-bg) 0%, white 60%);
  border-left-color: var(--moss);
}
.prow-briefing-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 5px;
  color: var(--ink-light);
}
.prow-briefing.urgent .prow-briefing-eye { color: var(--rust); }
.prow-briefing.warn .prow-briefing-eye { color: #8B6817; }
.prow-briefing.celebrate .prow-briefing-eye { color: var(--moss); }
.prow-briefing-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.25;
  margin-bottom: 5px;
  color: var(--ink-deep);
}
.prow-briefing-title em { font-style: italic; }
.prow-briefing.urgent .prow-briefing-title em { color: var(--rust); }
.prow-briefing.warn .prow-briefing-title em { color: #8B6817; }
.prow-briefing-pattern {
  font-size: 12px;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.45;
  margin-bottom: 10px;
}
.prow-briefing-actions {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.prow-briefing-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--ink-deep);
  cursor: pointer;
  transition: all 0.12s;
}
.prow-briefing-chip:hover {
  background: var(--ink-deep);
  color: var(--parchment);
  border-color: var(--ink-deep);
}
.prow-briefing-chip-num {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  font-weight: 700;
  color: white;
}
.prow-briefing.urgent .prow-briefing-chip-num { background: var(--rust); }
.prow-briefing.warn .prow-briefing-chip-num { background: var(--amber); }
.prow-briefing.celebrate .prow-briefing-chip-num { background: var(--moss); }
.prow-briefing-chip-when {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
}

.prow-actions {
  display: flex; gap: 4px;
  flex-shrink: 0;
  margin-top: 10px;
  flex-wrap: wrap;
}
.prow-act {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bone);
  border: 1px solid var(--line-faint);
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.12s;
}
.prow-act:hover {
  background: var(--ink-deep);
  border-color: var(--ink-deep);
  transform: translateY(-1px);
}
.prow-act.urgent {
  background: var(--rust-bg);
  border-color: var(--rust);
  color: var(--rust);
}
.prow-act.urgent:hover {
  background: var(--rust);
  color: white;
}
.prow-act.primary {
  background: var(--ink-deep);
  border-color: var(--ink-deep);
  color: var(--parchment);
}
.prow-act.primary:hover {
  background: var(--moss);
  border-color: var(--moss);
}

/* Expand/collapse button */
.prow-expand {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  background: var(--bone);
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-mid);
  transition: all 0.12s;
  flex-shrink: 0;
}
.prow-expand span:first-child {
  font-size: 15px;
  font-weight: 400;
  line-height: 1;
  width: 12px; text-align: center;
}
.prow-expand-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.prow-expand:hover {
  background: var(--ink-deep);
  border-color: var(--ink-deep);
  color: var(--parchment);
}
.prow-expand:hover .prow-expand-label { color: var(--parchment); }
.prow.expanded .prow-expand {
  background: var(--parchment-warm);
  border-color: var(--ink-deep);
  color: var(--ink-deep);
}

/* ===== SIDEBAR RIGHT ===== */
.sidebar-right {
  width: 290px;
  background: var(--bone);
  border-left: 1px solid var(--line-mid);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sr-section {
  border-bottom: 1px solid var(--line-faint);
  padding: 14px 17px;
}
.sr-section:last-child { border-bottom: none; }
.sr-section-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 9px;
}
.sr-today-item {
  display: grid;
  grid-template-columns: 50px 1fr;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line-faint);
}
.sr-today-item:last-child { border-bottom: none; }
.sr-today-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-deep);
  font-weight: 500;
}
.sr-today-time.now { color: var(--rust); }
.sr-today-content { min-width: 0; }
.sr-today-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-deep);
  line-height: 1.3;
}
.sr-today-meta {
  font-size: 10.5px;
  color: var(--ink-light);
  font-style: italic;
  margin-top: 1px;
}

.sr-team { display: flex; flex-direction: column; gap: 6px; }
.sr-team-row {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 7px;
  border-radius: 6px;
  font-size: 11.5px;
}
.sr-team-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--moss);
  flex-shrink: 0;
}
.sr-team-dot.busy { background: var(--amber); }
.sr-team-dot.offline { background: var(--line-mid); }
.sr-team-name { font-weight: 600; color: var(--ink-deep); flex: 1; }
.sr-team-status {
  font-size: 10px;
  color: var(--ink-light);
  font-style: italic;
}
.sr-team-row.you { background: var(--moss-bg); }

.sr-inbox-item {
  padding: 8px 0;
  border-bottom: 1px dashed var(--line-faint);
  cursor: pointer;
}
.sr-inbox-item:last-child { border-bottom: none; }
.sr-inbox-item:hover { background: var(--parchment-warm); }
.sr-inbox-row {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 2px;
}
.sr-inbox-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-deep);
}
.sr-inbox-when {
  font-size: 9.5px;
  color: var(--ink-light);
}
.sr-inbox-when.late { color: var(--rust); font-weight: 700; }
.sr-inbox-preview {
  font-size: 11px;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.sr-task-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 0;
  font-size: 11.5px;
  line-height: 1.35;
}
.sr-task-check {
  width: 14px; height: 14px;
  border: 1.5px solid var(--line-mid);
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
}
.sr-task-text {
  color: var(--ink-deep);
  flex: 1;
}
.sr-task-who {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 2px;
}

.sr-pulse {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.sr-pulse-cell {
  background: white;
  border: 1px solid var(--line-faint);
  border-radius: 7px;
  padding: 8px 10px;
}
.sr-pulse-label {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.sr-pulse-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  line-height: 1;
  margin-top: 4px;
}
.sr-pulse-val.good { color: var(--moss); }
.sr-pulse-val.warn { color: var(--amber); }
.sr-pulse-val.bad { color: var(--rust); }
.sr-pulse-delta {
  font-size: 9.5px;
  color: var(--ink-light);
  margin-top: 2px;
}
.sr-pulse-delta.up { color: var(--moss); }
.sr-pulse-delta.down { color: var(--rust); }

/* ===== PATIENT DETAIL OVERLAY ===== */
.pdetail {
  position: fixed;
  top: 48px;
  right: 0;
  width: 480px;
  height: calc(100vh - 48px);
  background: white;
  border-left: 1px solid var(--line-mid);
  box-shadow: -12px 0 40px rgba(31,27,22,0.12);
  display: flex; flex-direction: column;
  z-index: 500;
  animation: slideIn 0.25s ease-out;
}
@keyframes slideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.pdetail-head {
  display: flex; align-items: flex-start; gap: 13px;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line-faint);
}
.pdetail-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 20px;
  color: white;
  flex-shrink: 0;
}
.pdetail-avatar.moss { background: var(--moss); }
.pdetail-avatar.sienna { background: var(--sienna); }
.pdetail-avatar.plum { background: var(--plum); }
.pdetail-avatar.teal { background: var(--teal); }
.pdetail-avatar.amber { background: var(--amber); }
.pdetail-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 500;
  line-height: 1.15;
}
.pdetail-meta {
  font-size: 12px;
  color: var(--ink-mid);
  margin-top: 3px;
}
.pdetail-close {
  width: 30px; height: 30px;
  background: var(--bone);
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.pdetail-close:hover { background: white; }
.pdetail-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 22px 30px;
}
.pdetail-section { margin-bottom: 20px; }
.pdetail-section-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 8px;
}
.pdetail-alert {
  background: linear-gradient(135deg, var(--rust-bg), #FAE5DD);
  border-left: 3px solid var(--rust);
  border-radius: 0 8px 8px 0;
  padding: 11px 14px;
  margin-bottom: 14px;
}
.pdetail-alert-title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  color: var(--rust);
  margin-bottom: 4px;
  font-weight: 500;
}
.pdetail-alert-body {
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-deep);
}
.pdetail-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
.pdetail-metric {
  background: var(--bone);
  border-radius: 7px;
  padding: 9px 7px;
  text-align: center;
}
.pdetail-metric-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  line-height: 1;
}
.pdetail-metric-val.good { color: var(--moss); }
.pdetail-metric-val.warn { color: var(--amber); }
.pdetail-metric-val.bad { color: var(--rust); }
.pdetail-metric-val .u {
  font-family: 'Source Sans 3', sans-serif;
  font-style: normal;
  font-size: 9.5px;
  color: var(--ink-light);
}
.pdetail-metric-label {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 4px;
}

/* Weight chart in detail panel */
.pd-chart {
  background: var(--bone);
  border: 1px solid var(--line-faint);
  border-radius: 9px;
  padding: 12px 13px 6px;
}
.pd-chart-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.pd-chart-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 28px;
  line-height: 1;
  color: var(--ink-deep);
}
.pd-chart-val .u {
  font-family: 'Source Sans 3', sans-serif;
  font-style: normal;
  font-size: 11px;
  color: var(--ink-light);
  margin-left: 4px;
}
.pd-chart-delta {
  font-size: 11px;
  color: var(--ink-mid);
  margin-top: 4px;
  font-style: italic;
}

/* SentimentMap chart in detail panel */
.pd-smap {
  background: var(--bone);
  border: 1px solid var(--line-faint);
  border-radius: 9px;
  padding: 14px 13px;
}
.pd-smap-row {
  display: flex; gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.pd-smap-cell {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 40px;
}
.pd-smap-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--line-mid);
  border: 2px solid white;
  box-shadow: 0 1px 3px rgba(31,27,22,0.07);
}
.pd-smap-dot.green { background: var(--moss); }
.pd-smap-dot.amber { background: var(--amber); }
.pd-smap-dot.red { background: var(--rust); }
.pd-smap-dot.empty {
  background: white;
  border: 2px dashed var(--line-mid);
  box-shadow: none;
}
.pd-smap-dot.inline {
  width: 10px; height: 10px;
  display: inline-block;
  border: none;
  box-shadow: none;
  vertical-align: middle;
  margin-right: 4px;
}
.pd-smap-week {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.pd-smap-legend {
  display: flex; gap: 13px;
  padding-top: 9px;
  border-top: 1px dashed var(--line-faint);
  font-size: 10px;
  color: var(--ink-mid);
  flex-wrap: wrap;
}
.pd-smap-legend span { display: inline-flex; align-items: center; }
.pdetail-actions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}
.pdetail-action {
  display: flex; align-items: center; gap: 9px;
  background: var(--bone);
  border: 1px solid var(--line-faint);
  border-radius: 8px;
  padding: 9px 11px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all 0.12s;
}
.pdetail-action:hover {
  background: white;
  border-color: var(--ink-deep);
  transform: translateY(-1px);
}
.pdetail-action.urgent {
  background: var(--rust-bg);
  border-color: var(--rust);
}
.pdetail-action.urgent:hover {
  background: var(--rust);
  color: white;
}
.pdetail-action-icon { font-size: 15px; }
.pdetail-action-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-deep);
}
.pdetail-action.urgent .pdetail-action-label { color: var(--rust); }
.pdetail-action.urgent:hover .pdetail-action-label { color: white; }

.pdetail-history {
  display: flex; flex-direction: column; gap: 7px;
}
.pdetail-history-item {
  display: flex; gap: 9px;
  padding: 8px 11px;
  background: var(--bone);
  border-radius: 6px;
  font-size: 11.5px;
}
.pdetail-history-icon { font-size: 14px; }
.pdetail-history-content { flex: 1; }
.pdetail-history-when {
  font-size: 9.5px;
  color: var(--ink-light);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.pdetail-history-text {
  color: var(--ink-deep);
  margin-top: 2px;
  line-height: 1.4;
}

/* ===== COORTE VIEW ===== */
.coorte-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.coorte-block {
  background: white;
  border: 1px solid var(--line-faint);
  border-radius: 11px;
  padding: 16px 18px;
}
.coorte-block.full { grid-column: 1 / -1; }
.coorte-block-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 13px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line-faint);
}
.coorte-block-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 500;
}
.coorte-block-title em { font-style: italic; color: var(--moss); }
.coorte-block-sub {
  font-size: 10px;
  color: var(--ink-light);
}

.funil-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.funil-stage { text-align: center; }
.funil-bar {
  background: var(--bone);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  min-height: 50px;
  display: flex; align-items: flex-end;
}
.funil-fill {
  width: 100%;
  background: linear-gradient(180deg, var(--moss-bg), var(--moss));
  position: relative;
}
.funil-fill.titulacao { background: linear-gradient(180deg, var(--amber-bg), var(--amber)); }
.funil-fill.resposta { background: linear-gradient(180deg, var(--moss-bg), var(--moss)); }
.funil-fill.manutencao { background: linear-gradient(180deg, var(--teal-bg), var(--teal)); }
.funil-fill.reganho { background: linear-gradient(180deg, var(--rust-bg), var(--rust)); }
.funil-stage-name {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 5px;
}
.funil-stage-count {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  margin-top: 2px;
}
.funil-stage-pct {
  font-size: 10px;
  color: var(--ink-mid);
}

.vital-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.vital-card {
  background: var(--bone);
  border-radius: 9px;
  padding: 12px;
}
.vital-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 6px;
}
.vital-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 30px;
  line-height: 1;
}
.vital-val.good { color: var(--moss); }
.vital-val.warn { color: var(--amber); }
.vital-val.bad { color: var(--rust); }
.vital-val .u {
  font-family: 'Source Sans 3', sans-serif;
  font-style: normal;
  font-size: 13px;
  color: var(--ink-light);
}
.vital-delta {
  margin-top: 5px;
  font-size: 10.5px;
  display: flex; align-items: center; gap: 5px;
}
.vital-delta.up { color: var(--moss); }
.vital-delta.down { color: var(--rust); }
.vital-delta.flat { color: var(--ink-light); }
.vital-status {
  font-size: 10px;
  margin-top: 2px;
  font-style: italic;
}
.vital-status.good { color: var(--moss); }
.vital-status.warn { color: var(--amber); }
.vital-status.bad { color: var(--rust); }

.outlier-col {
  background: var(--bone);
  border-radius: 8px;
  padding: 11px 13px;
}
.outlier-col-head {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 8px;
}
.outlier-col-head.good { color: var(--moss); }
.outlier-col-head.bad { color: var(--rust); }
.outlier-list { display: flex; flex-direction: column; gap: 7px; }
.outlier-item {
  background: white;
  border-radius: 6px;
  padding: 8px 11px;
  font-size: 11.5px;
}
.outlier-name {
  font-weight: 700;
  color: var(--ink-deep);
  margin-bottom: 2px;
}
.outlier-detail {
  font-size: 10.5px;
  color: var(--ink-mid);
  line-height: 1.4;
}

.tag-bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 60px;
  gap: 9px;
  align-items: center;
  padding: 5px 0;
}
.tag-bar-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-deep);
}
.tag-bar-track {
  height: 7px;
  background: var(--bone);
  border-radius: 4px;
  overflow: hidden;
}
.tag-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--plum), var(--teal));
  border-radius: 4px;
}
.tag-bar-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-mid);
  text-align: right;
}

.sla-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 11px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line-faint);
}
.sla-row:last-child { border-bottom: none; }
.sla-name {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-deep);
}
.sla-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
}
.sla-target {
  font-size: 10px;
  color: var(--ink-light);
}
.sla-status {
  font-size: 15px;
}
.sla-status.good { color: var(--moss); }
.sla-status.warn { color: var(--amber); }
.sla-status.bad { color: var(--rust); }

/* ===== ANALYSIS SECTIONS · accordion · 13 sessions ===== */
.analysis-section {
  background: white;
  border: 1px solid var(--line-faint);
  border-radius: 11px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: box-shadow 0.15s;
}
.analysis-section.open { box-shadow: 0 2px 14px rgba(31,27,22,0.04); }
.analysis-section:hover { border-color: var(--line-mid); }
.analysis-head {
  width: 100%;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 14px;
  align-items: center;
  background: transparent;
  border: none;
  padding: 14px 18px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s;
}
.analysis-head:hover { background: var(--bone); }
.analysis-section.open .analysis-head { background: var(--parchment-warm); border-bottom: 1px solid var(--line-faint); }
.analysis-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--ink-deep);
  color: var(--parchment);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.analysis-section.open .analysis-num { background: var(--moss); }
.analysis-head-text { min-width: 0; }
.analysis-eyebrow {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 2px;
}
.analysis-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 500;
  color: var(--ink-deep);
  line-height: 1.2;
  margin-bottom: 2px;
}
.analysis-title em { font-style: italic; color: var(--moss); }
.analysis-subtitle {
  font-size: 11.5px;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.35;
}
.analysis-toggle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-mid);
  padding: 7px 11px;
  border: 1px solid var(--line-mid);
  border-radius: 6px;
  background: white;
  white-space: nowrap;
  transition: all 0.12s;
}
.analysis-toggle .hint {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-left: 4px;
}
.analysis-section.open .analysis-toggle { background: var(--moss); color: white; border-color: var(--moss); }
.analysis-section.open .analysis-toggle .hint { color: rgba(255,255,255,0.7); }
.analysis-head:hover .analysis-toggle { border-color: var(--ink-deep); }
.analysis-body {
  padding: 18px 22px 22px;
}

.analysis-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 14px;
}
.analysis-block {
  background: var(--bone);
  border-radius: 9px;
  padding: 14px 16px;
}
.analysis-block-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 11px;
}
.analysis-mini-stats {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-top: 8px;
  font-size: 11px;
  color: var(--ink-mid);
}
.analysis-mini-stats strong { color: var(--ink-deep); font-weight: 700; }
.analysis-note {
  background: linear-gradient(135deg, var(--moss-bg), var(--bone));
  border-left: 3px solid var(--moss);
  border-radius: 0 8px 8px 0;
  padding: 11px 14px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--ink-deep);
  margin-top: 6px;
}
.analysis-note strong { color: var(--moss); font-weight: 700; }
.analysis-note em { font-style: italic; }

/* Response bars · ours vs trial */
.response-bars { display: flex; flex-direction: column; gap: 8px; }
.response-bar-row {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 10px;
  align-items: center;
}
.response-bar-label {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: var(--ink-deep);
}
.response-bar-tracks {
  display: flex; flex-direction: column; gap: 3px;
}
.response-bar-track {
  height: 16px;
  background: white;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line-faint);
}
.response-bar-fill {
  height: 100%;
  border-radius: 4px;
}
.response-bar-fill.ours { background: linear-gradient(90deg, var(--moss), #6B8B53); }
.response-bar-fill.trial { background: linear-gradient(90deg, var(--slate), #76849A); opacity: 0.55; }
.response-bar-val {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-deep);
}
.response-bar-legend {
  display: flex; gap: 14px; margin-top: 9px;
  font-size: 10px; color: var(--ink-mid); font-style: italic;
}
.response-bar-legend .dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 4px;
}
.response-bar-legend .dot.ours { background: var(--moss); }
.response-bar-legend .dot.trial { background: var(--slate); opacity: 0.55; }

/* Histogram */
.histogram {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  height: 110px;
}
.histogram-bin { display: flex; flex-direction: column; }
.histogram-bar-wrap {
  flex: 1;
  display: flex;
  align-items: flex-end;
  padding-bottom: 2px;
}
.histogram-bar {
  width: 100%;
  border-radius: 3px 3px 0 0;
  position: relative;
  min-height: 12px;
  transition: opacity 0.15s;
}
.histogram-bar.good { background: linear-gradient(180deg, var(--moss-bg), var(--moss)); }
.histogram-bar.warn { background: linear-gradient(180deg, var(--amber-bg), var(--amber)); }
.histogram-bar.bad { background: linear-gradient(180deg, var(--rust-bg), var(--rust)); }
.histogram-val {
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: white;
}
.histogram-label {
  font-size: 8.5px;
  text-align: center;
  color: var(--ink-light);
  font-weight: 700;
  margin-top: 4px;
}
.histogram-stats {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 9px;
  border-top: 1px dashed var(--line-faint);
  font-size: 11px;
  color: var(--ink-mid);
}
.histogram-stats strong { color: var(--ink-deep); font-weight: 700; }

/* SentimentMap macro */
.sm-macro { display: flex; flex-direction: column; gap: 6px; }
.sm-macro-row {
  display: grid;
  grid-template-columns: 14px 1fr 1fr 70px;
  gap: 9px;
  align-items: center;
  font-size: 11px;
}
.sm-macro-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--line-mid);
}
.sm-macro-dot.green { background: var(--moss); }
.sm-macro-dot.amber { background: var(--amber); }
.sm-macro-dot.red { background: var(--rust); }
.sm-macro-label { color: var(--ink-deep); font-weight: 500; }
.sm-macro-bar {
  background: var(--line-faint);
  height: 8px; border-radius: 4px;
  overflow: hidden;
}
.sm-macro-fill { height: 100%; border-radius: 4px; }
.sm-macro-fill.green { background: var(--moss); }
.sm-macro-fill.amber { background: var(--amber); }
.sm-macro-fill.red { background: var(--rust); }
.sm-macro-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  text-align: right;
  color: var(--ink-mid);
}

/* Forest plot */
.forest-plot {
  margin: 4px 0 8px;
}
.forest-row {
  display: grid;
  grid-template-columns: 200px 50px 1fr 50px;
  gap: 11px;
  align-items: center;
  padding: 6px 0;
}
.forest-label { font-size: 12px; color: var(--ink-deep); font-weight: 500; }
.forest-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-light);
}
.forest-track {
  position: relative;
  height: 18px;
  background: var(--bone);
  border-radius: 3px;
}
.forest-zero {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 1.5px;
  background: var(--ink-deep);
}
.forest-ci {
  position: absolute;
  top: 50%;
  height: 2px;
  background: var(--line-mid);
  transform: translateY(-50%);
}
.forest-mean {
  position: absolute;
  top: 50%;
  width: 11px; height: 11px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid white;
  box-shadow: 0 1px 3px rgba(31,27,22,0.15);
}
.forest-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-deep);
  text-align: right;
}
.forest-axis {
  display: flex; justify-content: space-between;
  margin-left: 211px; margin-right: 51px;
  margin-top: 5px;
  padding: 0 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-light);
}

/* Resolution cards */
.resolution-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}
.resolution-stat {
  background: white;
  border-radius: 7px;
  padding: 11px 13px;
  text-align: center;
}
.resolution-val {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 26px;
  line-height: 1;
}
.resolution-val.good { color: var(--moss); }
.resolution-val.warn { color: var(--amber); }
.resolution-val.bad { color: var(--rust); }
.resolution-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-top: 6px;
}
.resolution-prev {
  font-size: 10.5px;
  color: var(--ink-mid);
  font-style: italic;
  margin-top: 3px;
  line-height: 1.3;
}

/* Tag bar kinds */
.tag-bar-fill.kind-urgent { background: linear-gradient(90deg, var(--rust), #8B3F28); }
.tag-bar-fill.kind-warn { background: linear-gradient(90deg, var(--amber), #A88439); }
.tag-bar-fill.kind-good { background: linear-gradient(90deg, var(--moss), #4A6336); }
.tag-bar-fill.kind-default { background: linear-gradient(90deg, var(--slate), #4D5663); }

/* Glossário · always at the bottom */
.glossario {
  margin-top: 30px;
  padding: 22px 24px;
  background: var(--parchment-warm);
  border-radius: 11px;
  border: 1px solid var(--line-mid);
}
.glossario-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 14px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line-mid);
}
.glossario-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px 22px;
}
.glossario-item {
  display: grid;
  grid-template-columns: 85px 1fr;
  gap: 10px;
  font-size: 11.5px;
  line-height: 1.4;
  padding: 5px 0;
  border-bottom: 1px dashed var(--line-faint);
}
.glossario-sigla {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--ink-deep);
  letter-spacing: 0.04em;
}
.glossario-full {
  color: var(--ink-mid);
  font-style: italic;
}
.glossario-note {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line-mid);
  font-size: 10.5px;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.5;
}
.glossario-note strong { color: var(--ink-deep); font-style: normal; font-weight: 700; }

@media (max-width: 1100px) {
  .analysis-grid { grid-template-columns: 1fr; }
  .glossario-grid { grid-template-columns: 1fr; }
  .forest-row { grid-template-columns: 140px 40px 1fr 45px; }
  .forest-axis { margin-left: 151px; margin-right: 46px; }
}

/* ===== INTERACTIVE CHARTS · hover states ===== */
.vital-card.interactive,
.response-bar-track,
.histogram-bin,
.sm-macro-row,
.forest-row {
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.vital-card.interactive:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(31,27,22,0.08);
}
.histogram-bin:hover .histogram-bar { transform: scaleY(1.04); transform-origin: bottom; filter: brightness(1.05); }
.sm-macro-row:hover { background: var(--parchment-warm); border-radius: 6px; padding-left: 4px; margin-left: -4px; }
.forest-row:hover { background: var(--parchment-warm); border-radius: 6px; }
.forest-row:hover .forest-mean { transform: translate(-50%, -50%) scale(1.4); transition: transform 0.15s; }
.response-bar-track:hover .response-bar-fill { filter: brightness(1.08); }
.sla-row { cursor: pointer; transition: background 0.12s; }
.sla-row:hover { background: var(--parchment-warm); border-radius: 4px; }
.trig-table tbody tr { cursor: pointer; transition: background 0.12s; }
.trig-table tbody tr:hover { background: var(--parchment-warm); }
.resolution-stat { cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.resolution-stat:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(31,27,22,0.07); }
.tag-bar-row { cursor: pointer; transition: background 0.12s; border-radius: 4px; }
.tag-bar-row:hover { background: var(--parchment-warm); padding-left: 4px; margin-left: -4px; }

/* Triggers & Hoje views · interactive elements */
.recur-item, .cluster-item, .predict-item, .hoje-card {
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.recur-item:hover, .cluster-item:hover, .predict-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 16px rgba(31,27,22,0.07);
}
.hoje-card:hover {
  transform: translateX(2px);
  box-shadow: 0 5px 18px rgba(31,27,22,0.08);
}

/* 📐 DEV PANEL · engineering instructions in decision tree view */
.dev-panel {
  background: linear-gradient(135deg, #2A2622, #1F1B16);
  color: var(--parchment);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 22px;
  border-left: 4px solid var(--moss);
}
.dev-panel-eye {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--moss);
  margin-bottom: 12px;
  padding-bottom: 9px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.dev-panel-body p {
  font-size: 12.5px;
  line-height: 1.55;
  color: rgba(247,243,233,0.88);
  margin: 0 0 9px;
}
.dev-panel-body strong { color: var(--parchment); font-weight: 700; }
.dev-panel-body em { color: var(--amber); font-style: italic; font-weight: 600; }
.dev-code {
  background: rgba(0,0,0,0.35);
  color: #C8DBB4;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.6;
  padding: 12px 14px;
  border-radius: 7px;

  margin: 8px 0 12px;

}

.alert-card { cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.alert-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31,27,22,0.1); }
.alert-chip { cursor: pointer; transition: transform 0.12s, background 0.12s; }
.alert-chip:hover { transform: scale(1.02); }

/* ═══════════════════════════════════════════════════════════
   EXPORT CENTER · 3-step wizard dialog
   ═══════════════════════════════════════════════════════════ */
.exp-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31,27,22,0.55);
  z-index: 1800;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  backdrop-filter: blur(3px);
  animation: backdrop-in 0.18s ease-out;
}
.exp-dialog {
  background: var(--parchment);
  border-radius: 14px;
  width: 100%;
  max-width: 1080px;
  max-height: calc(100vh - 50px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 70px rgba(31,27,22,0.35);
  overflow: hidden;
  animation: modal-in 0.24s ease-out;
}
.exp-head {
  padding: 20px 28px 16px;
  background: white;
  border-bottom: 1px solid var(--line-faint);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.exp-eyebrow {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--moss);
  margin-bottom: 5px;
}
.exp-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 500;
  color: var(--ink-deep);
  line-height: 1.1;
  margin-bottom: 4px;
}
.exp-title em { font-style: italic; color: var(--moss); }
.exp-sub {
  font-size: 12px;
  color: var(--ink-mid);
  font-style: italic;
}
.exp-close {
  width: 32px; height: 32px;
  background: var(--bone);
  border: 1px solid var(--line-mid);
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.exp-close:hover { background: white; border-color: var(--ink-deep); }

.exp-progress {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 13px 28px;
  background: var(--bone);
  border-bottom: 1px solid var(--line-faint);
}
.exp-step {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px;
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-light);
  transition: all 0.15s;
}
.exp-step.active { background: var(--ink-deep); color: var(--parchment); border-color: var(--ink-deep); }
.exp-step.done { background: var(--moss); color: white; border-color: var(--moss); }
.exp-step-num {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--bone);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-light);
}
.exp-step.active .exp-step-num { background: rgba(255,255,255,0.18); color: var(--parchment); }
.exp-step.done .exp-step-num { background: rgba(255,255,255,0.22); color: white; }
.exp-step-label { letter-spacing: 0.06em; }

.exp-body {
  padding: 20px 28px;
  overflow-y: auto;
  flex: 1;
  background: var(--parchment);
}

/* STEP 1 · presets */
.exp-presets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.exp-preset-card {
  background: white;
  border: 2px solid var(--line-faint);
  border-radius: 12px;
  padding: 16px 17px;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.exp-preset-card:hover {
  border-color: var(--moss);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(92,117,68,0.13);
}
.exp-preset-card.active {
  border-color: var(--moss);
  background: var(--moss-bg);
}
.exp-preset-icon {
  font-size: 30px;
  line-height: 1;
}
.exp-preset-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-style: italic;
  font-weight: 500;
  color: var(--ink-deep);
  line-height: 1.15;
}
.exp-preset-desc {
  font-size: 11.5px;
  color: var(--ink-mid);
  line-height: 1.45;
}
.exp-preset-meta {
  background: var(--bone);
  border-radius: 7px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10.5px;
  margin-top: auto;
}
.exp-preset-meta-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.exp-preset-meta-row span { color: var(--ink-light); }
.exp-preset-meta-row strong { color: var(--ink-deep); font-weight: 600; text-align: right; font-size: 10.5px; }
.exp-preset-btn {
  background: var(--ink-deep);
  color: var(--parchment);
  border: none;
  border-radius: 7px;
  padding: 7px 11px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: background 0.12s;
  margin-top: 4px;
}
.exp-preset-card:hover .exp-preset-btn { background: var(--moss); }

/* STEP 2 · customize */
.exp-customize {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.exp-section {
  background: white;
  border: 1px solid var(--line-faint);
  border-radius: 11px;
  padding: 15px 17px;
}
.exp-section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 11px;
  padding-bottom: 9px;
  border-bottom: 1px dashed var(--line-faint);
}
.exp-section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-style: italic;
  font-weight: 500;

}

  font-size: 11px;

}
.exp-section-tools {

}
.exp-mini-btn {
  background: var(--bone);

  padding: 4px 9px;
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-mid);

  transition: all 0.12s;
  white-space: nowrap;
}
.exp-mini-btn:hover { background: var(--ink-deep); color: var(--parchment); border-color: var(--ink-deep); }

.exp-grid-sections {

}
.exp-section-chip {
  display: flex;

  border-radius: 7px;
  cursor: pointer;
  transition: all 0.12s;
}
.exp-section-chip:hover { background: white; border-color: var(--line-mid); }
.exp-section-chip.active { background: var(--moss-bg); border-color: var(--moss); }
.exp-section-chip input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--moss);
  flex-shrink: 0;
}
.exp-section-chip-name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-deep);
  line-height: 1.3;
}
.exp-section-chip-num {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--ink-deep);
  color: var(--parchment);
  padding: 1px 5px;
  border-radius: 3px;
  margin-right: 5px;
  font-weight: 700;
}
.exp-section-chip.active .exp-section-chip-num { background: var(--moss); color: white; }
.exp-section-chip-sub {
  font-size: 10.5px;
  color: var(--ink-mid);
  font-style: italic;
  margin-top: 2px;
  line-height: 1.4;
}

.exp-grid-formats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.exp-format-chip {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 12px;
  background: var(--bone);
  border: 1.5px solid var(--line-faint);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
}
.exp-format-chip:hover { background: white; border-color: var(--line-mid); }
.exp-format-chip.active { background: var(--moss-bg); border-color: var(--moss); }
.exp-format-chip input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--moss);
  flex-shrink: 0;
}
.exp-format-icon { font-size: 20px; flex-shrink: 0; }
.exp-format-name { font-size: 13px; font-weight: 700; color: var(--ink-deep); }
.exp-format-desc { font-size: 10.5px; color: var(--ink-mid); font-style: italic; margin-top: 2px; line-height: 1.4; }

.exp-grid-filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.exp-field { display: flex; flex-direction: column; gap: 4px; }
.exp-field label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.exp-input {
  border: 1px solid var(--line-mid);
  border-radius: 7px;
  padding: 8px 11px;
  font-family: inherit;
  font-size: 13px;
  background: white;
  color: var(--ink-deep);
}
.exp-input:focus { outline: none; border-color: var(--ink-deep); box-shadow: 0 0 0 3px rgba(31,27,22,0.07); }

.exp-anon-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.exp-anon-card {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 11px 13px;
  background: var(--bone);
  border: 1.5px solid var(--line-faint);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
}
.exp-anon-card:hover { background: white; }
.exp-anon-card.active { background: var(--moss-bg); border-color: var(--moss); }
.exp-anon-card.active.urgent { background: var(--rust-bg); border-color: var(--rust); }
.exp-anon-card.active.warn { background: var(--amber-bg); border-color: var(--amber); }
.exp-anon-card input[type="radio"] { margin-top: 3px; accent-color: var(--moss); flex-shrink: 0; }
.exp-anon-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-deep);
  display: flex;
  align-items: center;
  gap: 7px;
}
.exp-anon-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--moss);
  flex-shrink: 0;
}
.exp-anon-dot.urgent { background: var(--rust); }
.exp-anon-dot.warn { background: var(--amber); }
.exp-anon-dot.good { background: var(--moss); }
.exp-anon-desc {
  font-size: 11px;
  color: var(--ink-mid);
  font-style: italic;
  margin-top: 3px;
  line-height: 1.45;
}

.exp-extras {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.exp-toggle {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 12px;
  background: var(--bone);
  border: 1.5px solid var(--line-faint);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
}
.exp-toggle:hover { background: white; }
.exp-toggle:has(input:checked) { background: var(--moss-bg); border-color: var(--moss); }
.exp-toggle input[type="checkbox"] { margin-top: 3px; accent-color: var(--moss); flex-shrink: 0; }
.exp-toggle-name { font-size: 12.5px; font-weight: 700; color: var(--ink-deep); }
.exp-toggle-desc { font-size: 10.5px; color: var(--ink-mid); font-style: italic; margin-top: 2px; line-height: 1.4; }

.exp-schedule {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.exp-schedule-opt {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 11px 13px;
  background: var(--bone);
  border: 1.5px solid var(--line-faint);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
}
.exp-schedule-opt:hover { background: white; }
.exp-schedule-opt.active { background: var(--moss-bg); border-color: var(--moss); }
.exp-schedule-opt input[type="radio"] { margin-top: 3px; accent-color: var(--moss); flex-shrink: 0; }
.exp-schedule-name { font-size: 13px; font-weight: 700; color: var(--ink-deep); }
.exp-schedule-desc { font-size: 11px; color: var(--ink-mid); font-style: italic; margin-top: 2px; line-height: 1.4; }

/* STEP 3 · preview */
.exp-preview { display: flex; flex-direction: column; gap: 16px; }
.exp-preview-grid {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 16px;
}
.exp-preview-cover {
  background: linear-gradient(160deg, #FAF6EC 0%, white 60%);
  border: 2px solid var(--ink-deep);
  border-radius: 8px;
  padding: 22px 18px;
  position: relative;
  min-height: 360px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 26px rgba(31,27,22,0.13);
}
.exp-mock-watermark {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-22deg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: rgba(31,27,22,0.05);
  pointer-events: none;
  white-space: nowrap;
}
.exp-mock-logo { font-size: 32px; margin-bottom: 6px; }
.exp-mock-eye {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 7px;
}
.exp-mock-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 500;
  color: var(--ink-deep);
  line-height: 1.15;
  margin-bottom: 16px;
}
.exp-mock-title em { font-style: italic; color: var(--moss); display: block; font-size: 15px; }
.exp-mock-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 10.5px;
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--line-faint);
}
.exp-mock-meta-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.exp-mock-meta-row span:first-child { color: var(--ink-light); }
.exp-mock-meta-row span:last-child, .exp-mock-meta-row strong { color: var(--ink-deep); font-weight: 600; }
.exp-mock-meta-row strong { font-weight: 700; }
.exp-mock-footer {
  font-size: 9px;
  color: var(--ink-light);
  text-align: center;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--line-faint);
}

.exp-preview-toc {
  background: white;
  border: 1px solid var(--line-mid);
  border-radius: 8px;
  padding: 14px 16px;
}
.exp-preview-toc-eye {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line-faint);
}
.exp-preview-toc-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  padding: 6px 0;

  border-bottom: 1px dashed var(--line-faint);
}
.exp-preview-toc-item:last-child { border-bottom: none; }
.exp-preview-toc-item.extra { background: var(--bone); border-radius: 5px; padding: 6px 8px; margin: 4px 0; border: none; }
.exp-preview-toc-num {
  width: 26px; height: 22px;
  background: var(--moss);
